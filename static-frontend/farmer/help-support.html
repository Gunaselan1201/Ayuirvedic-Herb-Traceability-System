<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Help &amp; Support - Farmer Portal</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</head>
<body data-page="helpSupport">
  <div id="app-shell"></div>

  <div class="help-header">
    <div class="max-w-7xl">
      <button class="back-link" id="backBtn" style="color:#15803d;"></button>
      <h1>Help &amp; Support</h1>
      <p>Find answers, report issues, and get assistance</p>
    </div>
  </div>

  <div class="help-tabs">
    <div class="help-tabs-inner" id="tabsRow"></div>
  </div>

  <div class="help-content" id="tabContent"></div>

  <div class="modal-backdrop hidden" id="modalBackdrop"></div>

  <script>
    document.getElementById('backBtn').innerHTML = icon('arrowLeft', 20) + ' Back';
    document.getElementById('backBtn').addEventListener('click', function () { window.location.href = 'dashboard.html'; });

    var TABS = [
      { id: 'gettingStarted', label: 'Getting Started', i: 'bookOpen' },
      { id: 'appeal', label: 'How to Appeal', i: 'fileText' },
      { id: 'reportIssue', label: 'Report a Problem', i: 'alertCircle' },
      { id: 'guides', label: 'Guides & Tutorials', i: 'video' },
      { id: 'faqs', label: 'FAQs', i: 'messageSquare' },
      { id: 'contact', label: 'Contact Support', i: 'phone' },
      { id: 'feedback', label: 'Feedback', i: 'star' }
    ];
    var activeTab = 'gettingStarted';

    function renderTabs() {
      document.getElementById('tabsRow').innerHTML = TABS.map(function (t) {
        return '<button class="help-tab' + (t.id === activeTab ? ' active' : '') + '" data-tab="' + t.id + '">' + icon(t.i, 20) + t.label + '</button>';
      }).join('');
      document.querySelectorAll('[data-tab]').forEach(function (btn) {
        btn.addEventListener('click', function () { activeTab = btn.getAttribute('data-tab'); renderTabs(); renderContent(); });
      });
    }

    var GETTING_STARTED = [
      { title: 'How to log in', i: 'bookOpen' },
      { title: 'How to add a new herb/product batch', i: 'package' },
      { title: 'How to generate batch ID', i: 'link' },
      { title: 'How to check submission status', i: 'checkCircle' },
      { title: 'How to change portal language', i: 'messageSquare' }
    ];
    var GUIDES = [
      { title: 'Submit a New Batch', i: 'package' },
      { title: 'Understand Blockchain Verification', i: 'link' },
      { title: 'Tracking Product Journey via QR', i: 'link' },
      { title: 'How Lab Testing Works', i: 'testTube' },
      { title: 'Appealing a Rejected Batch', i: 'fileText' }
    ];
    var FAQS = [
      { q: 'Why is my batch still pending?', a: 'Your batch is currently under laboratory testing. This process typically takes 3-5 business days.' },
      { q: 'What does "Blockchain Verified" mean?', a: 'It means your batch data has been permanently recorded on the blockchain and cannot be altered.' },
      { q: 'Can I edit my data after submission?', a: 'Once submitted, batch data cannot be edited due to blockchain immutability. Please contact support if corrections are needed.' },
      { q: 'How to contact my nearest lab?', a: 'Go to the "Sent for Testing" section to view lab contact details for your batch.' },
      { q: 'How to reset password?', a: 'Contact your portal administrator or use the "Forgot Password" link on the login page.' }
    ];
    var expandedFaq = null;

    function renderContent() {
      var el = document.getElementById('tabContent');
      if (activeTab === 'gettingStarted') {
        el.innerHTML = '<h2>Getting Started</h2><div class="help-grid-2">' + GETTING_STARTED.map(function (item) {
          return '<div class="help-item-card"><div class="row"><div class="iconbox">' + icon(item.i, 24) + '</div>' +
            '<div><h3>' + item.title + '</h3><p>Click to learn more</p></div></div></div>';
        }).join('') + '</div>';
      } else if (activeTab === 'appeal') {
        el.innerHTML = '<h2>How to Appeal / Raise a Dispute</h2>' +
          '<div class="appeal-box"><h3>What is an appeal?</h3>' +
          '<p>An appeal allows you to clarify or dispute decisions made by the lab or manufacturer regarding your batch, such as incorrect test results, wrong grades, or rejected batches.</p>' +
          '<h3>When can I raise it?</h3><ul>' +
          '<li>Incorrect lab result or grade</li><li>Missing or incomplete data</li><li>Unfairly rejected batch</li><li>Other quality concerns</li></ul></div>' +
          '<button class="btn btn-green-solid" id="openAppealBtn">' + icon('fileText', 20) + ' Submit an Appeal</button>';
        document.getElementById('openAppealBtn').addEventListener('click', openAppealModal);
      } else if (activeTab === 'reportIssue') {
        el.innerHTML = '<h2>Report a Problem</h2><p style="color:#4b5563;margin-bottom:1.5rem;">Having technical issues or found a bug? Let us know so we can fix it.</p>' +
          '<button class="btn btn-red" id="openIssueBtn">' + icon('alertCircle', 20) + ' Report an Issue</button>';
        document.getElementById('openIssueBtn').addEventListener('click', openIssueModal);
      } else if (activeTab === 'guides') {
        el.innerHTML = '<h2>Guides &amp; Tutorials</h2><div class="help-grid-3">' + GUIDES.map(function (g) {
          return '<div class="help-item-card"><div class="iconbox" style="display:inline-flex;margin-bottom:1rem;">' + icon(g.i, 28) + '</div>' +
            '<h3>' + g.title + '</h3><button style="background:none;border:none;color:#22c55e;font-size:0.875rem;font-weight:500;padding:0;">View Guide &rarr;</button></div>';
        }).join('') + '</div>';
      } else if (activeTab === 'faqs') {
        el.innerHTML = '<h2>Frequently Asked Questions</h2>' + FAQS.map(function (f, i) {
          return '<div class="faq-card"><button class="faq-question' + (expandedFaq === i ? ' open' : '') + '" data-faq="' + i + '"><span>' + f.q + '</span>' + icon('chevronDown', 20) + '</button>' +
            (expandedFaq === i ? '<div class="faq-answer">' + f.a + '</div>' : '') + '</div>';
        }).join('');
        document.querySelectorAll('[data-faq]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var i = Number(btn.getAttribute('data-faq'));
            expandedFaq = expandedFaq === i ? null : i;
            renderContent();
          });
        });
      } else if (activeTab === 'contact') {
        el.innerHTML = '<h2>Contact Support</h2><div class="help-grid-2" style="margin-bottom:2rem;">' +
          '<div class="contact-card"><div class="row"><div class="iconbox">' + icon('phone', 24) + '</div><div><h3>Helpline</h3><p class="big">1800-2025-25027</p></div></div></div>' +
          '<div class="contact-card"><div class="row"><div class="iconbox">' + icon('mail', 24) + '</div><div><h3>Email</h3><p style="color:#111827;margin:0;">support@ayurledger.gov.in</p></div></div></div>' +
          '<div class="contact-card" style="grid-column:1/-1;"><div class="row"><div class="iconbox" style="background:#ffedd5;"><span style="color:#ea580c;">' + icon('clock', 24) + '</span></div><div><h3>Office Hours</h3><p style="color:#111827;margin:0;">9 AM &ndash; 6 PM (Monday to Saturday)</p></div></div></div>' +
          '</div><button class="btn btn-green-solid" id="openContactBtn">' + icon('send', 20) + ' Send Message</button>';
        document.getElementById('openContactBtn').addEventListener('click', openContactModal);
      } else if (activeTab === 'feedback') {
        el.innerHTML = '<h2>Feedback &amp; Rating</h2>' +
          '<form id="feedbackForm" class="section-card" style="max-width:42rem;">' +
          '<div class="mb-6"><label style="display:block;font-size:0.875rem;font-weight:600;color:#374151;margin-bottom:0.75rem;">Rate your experience</label>' +
          '<div class="flex gap-2" id="starRow"></div></div>' +
          '<div class="mb-6"><label style="display:block;font-size:0.875rem;font-weight:600;color:#374151;margin-bottom:0.5rem;">Your feedback</label>' +
          '<textarea id="feedbackText" rows="4" placeholder="Tell us about your experience..." style="width:100%;padding:0.5rem 1rem;border:1px solid #d1d5db;border-radius:0.5rem;font-family:inherit;"></textarea></div>' +
          '<button type="submit" class="btn btn-green-solid" id="feedbackSubmitBtn" disabled>Submit Feedback</button></form>';
        var rating = 0;
        function renderStars() {
          document.getElementById('starRow').innerHTML = [1, 2, 3, 4, 5].map(function (s) {
            return '<button type="button" data-star="' + s + '" style="background:none;border:none;color:' + (s <= rating ? '#facc15' : '#d1d5db') + ';">' + icon('star', 32) + '</button>';
          }).join('');
          document.querySelectorAll('[data-star]').forEach(function (btn) {
            btn.addEventListener('click', function () { rating = Number(btn.getAttribute('data-star')); renderStars(); document.getElementById('feedbackSubmitBtn').disabled = rating === 0; });
          });
        }
        renderStars();
        document.getElementById('feedbackForm').addEventListener('submit', function (e) {
          e.preventDefault();
          showToast('Thank you! Your feedback helps improve the system.');
          rating = 0; document.getElementById('feedbackText').value = ''; renderStars();
          document.getElementById('feedbackSubmitBtn').disabled = true;
        });
      }
    }

    function modalShell(title, bodyHTML) {
      var backdrop = document.getElementById('modalBackdrop');
      backdrop.innerHTML = '<div class="modal-box">' +
        '<div class="modal-head"><h3>' + title + '</h3><button class="modal-close" id="modalCloseBtn">' + icon('x', 24) + '</button></div>' +
        '<div class="modal-body">' + bodyHTML + '</div></div>';
      backdrop.classList.remove('hidden');
      document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
      backdrop.addEventListener('click', function (e) { if (e.target === backdrop) closeModal(); });
    }
    function closeModal() {
      var backdrop = document.getElementById('modalBackdrop');
      backdrop.classList.add('hidden');
      backdrop.innerHTML = '';
    }

    function openAppealModal() {
      modalShell('Submit an Appeal',
        '<form id="appealForm">' +
        '<div class="field mb-4"><label>Batch ID</label><select id="appealBatch" required><option value="">Select Batch</option>' +
        APPROVED_BY_LAB.concat(REJECTED_FAILED).map(function (b) { return '<option>' + b.id + '</option>'; }).join('') + '</select></div>' +
        '<div class="field mb-4"><label>Reason for Appeal</label><select id="appealReason" required><option value="">Select Reason</option>' +
        '<option>Incorrect Lab Result</option><option>Missing Data</option><option>Rejected Batch</option><option>Other</option></select></div>' +
        '<div class="field mb-6"><label>Description</label><textarea id="appealDesc" rows="4" required placeholder="Describe your appeal in detail..." style="width:100%;padding:0.5rem 1rem;border:1px solid #d1d5db;border-radius:0.5rem;font-family:inherit;"></textarea></div>' +
        '<div class="modal-actions"><button type="submit" class="btn btn-green-solid" style="flex:1;">Submit Appeal</button>' +
        '<button type="button" class="btn btn-outline" id="appealCancel">Cancel</button></div></form>');
      document.getElementById('appealCancel').addEventListener('click', closeModal);
      document.getElementById('appealForm').addEventListener('submit', function (e) {
        e.preventDefault();
        closeModal();
        showToast('Appeal submitted successfully');
      });
    }

    function openIssueModal() {
      modalShell('Report an Issue',
        '<form id="issueForm">' +
        '<div class="field mb-4"><label>Category</label><select id="issueCategory" required><option value="">Select Category</option>' +
        '<option>Portal Bug</option><option>QR Error</option><option>Data Missing</option><option>Other</option></select></div>' +
        '<div class="field mb-6"><label>Description</label><textarea id="issueDesc" rows="4" required placeholder="Describe the issue you encountered..." style="width:100%;padding:0.5rem 1rem;border:1px solid #d1d5db;border-radius:0.5rem;font-family:inherit;"></textarea></div>' +
        '<div class="modal-actions"><button type="submit" class="btn btn-red" style="flex:1;">Submit Report</button>' +
        '<button type="button" class="btn btn-outline" id="issueCancel">Cancel</button></div></form>');
      document.getElementById('issueCancel').addEventListener('click', closeModal);
      document.getElementById('issueForm').addEventListener('submit', function (e) {
        e.preventDefault();
        closeModal();
        showToast('Issue reported successfully. Our team will review it soon.');
      });
    }

    function openContactModal() {
      modalShell('Send Message',
        '<form id="contactForm">' +
        '<div class="field mb-4"><label>Subject</label><input type="text" id="contactSubject" required placeholder="Enter subject"></div>' +
        '<div class="field mb-6"><label>Message</label><textarea id="contactMessage" rows="5" required placeholder="Type your message here..." style="width:100%;padding:0.5rem 1rem;border:1px solid #d1d5db;border-radius:0.5rem;font-family:inherit;"></textarea></div>' +
        '<div class="modal-actions"><button type="submit" class="btn btn-green-solid" style="flex:1;">' + icon('send', 18) + ' Send</button>' +
        '<button type="button" class="btn btn-outline" id="contactCancel">Cancel</button></div></form>');
      document.getElementById('contactCancel').addEventListener('click', closeModal);
      document.getElementById('contactForm').addEventListener('submit', function (e) {
        e.preventDefault();
        closeModal();
        showToast('Message sent successfully');
      });
    }

    renderTabs();
    renderContent();
  </script>
</body>
</html>
