<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batch Detail - Sent for Testing</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</head>
<body data-page="sentForTestingDetail">
  <div id="app-shell"></div>

  <main class="min-h-screen" style="background:linear-gradient(to bottom right,#eff6ff,#f3f4f6);padding:1.5rem;">
    <button class="back-link blue" id="backBtn"></button>
    <div id="headerCard"></div>
    <div class="detail-grid">
      <div class="detail-col">
        <div class="section-card">
          <div class="section-head"><div class="iconbox green"></div><h2>Farmer Details</h2></div>
          <div class="field-grid" id="farmerFields"></div>
        </div>
        <div class="section-card">
          <div class="section-head"><div class="iconbox yellow"></div><h2>Transport Details</h2></div>
          <div id="transportBody"></div>
        </div>
        <div class="section-card">
          <div class="section-head"><div class="iconbox purple"></div><h2>Laboratory Details</h2></div>
          <div class="field-grid" id="labFields"></div>
        </div>
      </div>
      <div>
        <div class="section-card sticky-col">
          <h2 style="font-size:1.25rem;font-weight:700;color:#1f2937;margin:0 0 1.5rem;">Status Timeline</h2>
          <div class="timeline" id="timeline"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    document.getElementById('backBtn').innerHTML = icon('arrowLeft', 20) + ' Back to List';
    document.getElementById('backBtn').addEventListener('click', function () { window.location.href = 'sent-for-testing.html'; });
    document.querySelector('.iconbox.green').innerHTML = icon('user', 20);
    document.querySelector('.iconbox.yellow').innerHTML = icon('truck', 20);
    document.querySelector('.iconbox.purple').innerHTML = icon('flask', 20);

    var params = new URLSearchParams(window.location.search);
    var id = params.get('id') || (SENT_FOR_TESTING[0] && SENT_FOR_TESTING[0].id) || 'SURTN1201NE';
    var batch = SENT_FOR_TESTING.find(function (b) { return b.id === id; }) || SENT_FOR_TESTING[0];

    document.getElementById('headerCard').innerHTML =
      '<div class="detail-header-card blue mb-6"><div class="detail-header-top">' +
      '<div><h1>' + batch.id + '</h1><p class="product">' + batch.productName + '</p><p class="qty">Quantity: ' + batch.quantity + '</p></div>' +
      '<span class="badge" style="background:#fef9c3;color:#a16207;padding:0.5rem 1rem;font-size:0.875rem;">Sent for Testing</span>' +
      '</div></div>';

    document.getElementById('farmerFields').innerHTML =
      '<div><p class="field-label">Farmer Name</p><p class="field-value">' + getFarmerData().farmerName + '</p></div>' +
      '<div><p class="field-label">Farmer ID</p><p class="field-value">' + getFarmerData().farmerId + '</p></div>' +
      '<div><p class="field-label">Location</p><p class="field-value">' + batch.location + '</p></div>' +
      '<div><p class="field-label">Contact</p><p class="field-value">+91 98765 43210</p></div>';

    document.getElementById('transportBody').innerHTML =
      '<div class="flex items-center justify-between mb-4" style="padding:1rem;background:#fefce8;border-radius:0.5rem;border:1px solid #fef08a;">' +
      '<div><p class="field-label">Current Status</p><p style="font-weight:700;color:#a16207;margin:0;">Sent for Testing</p></div>' +
      '<div class="flex items-center gap-2" style="color:#ca8a04;"><span style="width:12px;height:12px;background:#eab308;border-radius:999px;"></span><span style="font-size:0.875rem;font-weight:600;">Live Tracking</span></div>' +
      '</div>' +
      '<div class="field-grid mb-4">' +
      '<div><p class="field-label">Vehicle Number</p><p class="field-value">N/A</p></div>' +
      '<div><p class="field-label">Driver Name</p><p class="field-value">N/A</p></div>' +
      '<div><p class="field-label">Started On</p><p class="field-value">' + batch.dateSent + '</p></div>' +
      '<div><p class="field-label">Expected Arrival</p><p class="field-value">TBD</p></div>' +
      '</div>' +
      '<div class="flex items-center gap-2" style="padding:0.75rem;background:#eff6ff;border-radius:0.5rem;">' + icon('mapPin', 16) +
      '<span style="font-size:0.875rem;color:#1e40af;font-weight:500;">' + batch.location + '</span></div>';

    document.getElementById('labFields').innerHTML =
      '<div><p class="field-label">Lab Name</p><p class="field-value">Quality Testing Lab</p></div>' +
      '<div><p class="field-label">Location</p><p class="field-value">Lab Location</p></div>' +
      '<div><p class="field-label">Contact</p><p class="field-value">N/A</p></div>' +
      '<div><p class="field-label">Email</p><p class="field-value">lab@test.com</p></div>';

    var timeline = [
      { title: 'Batch Created', date: batch.harvestDate, status: 'completed', i: 'package', desc: 'Batch registered in system' },
      { title: 'Sent for Testing', date: batch.dateSent, status: 'completed', i: 'truck', desc: 'Dispatched to testing facility' },
      { title: 'In Transit', date: batch.dateSent, status: 'active', i: 'truck', desc: 'On the way to lab' },
      { title: 'Receive at Lab', date: 'Pending', status: 'pending', i: 'mapPin', desc: 'Arrival at testing facility' },
      { title: 'Testing Begins', date: 'Pending', status: 'pending', i: 'flask', desc: 'Laboratory testing process' },
      { title: 'Results Ready', date: 'Expected soon', status: 'pending', i: 'checkCircle', desc: 'Test results and grading' }
    ];
    document.getElementById('timeline').innerHTML = timeline.map(function (t) {
      return '<div class="timeline-item"><div class="timeline-icon ' + t.status + '">' + icon(t.i, 16) + '</div>' +
        '<div><p class="title' + (t.status === 'pending' ? ' faded' : '') + '">' + t.title + '</p>' +
        '<p class="date">' + t.date + '</p><p class="desc">' + t.desc + '</p></div></div>';
    }).join('');
  </script>
</body>
</html>
