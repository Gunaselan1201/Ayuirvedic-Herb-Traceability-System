<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batch Detail - Approved by Lab</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</head>
<body data-page="approvedByLabDetail">
  <div id="app-shell"></div>

  <main class="min-h-screen" style="background:linear-gradient(to bottom right,#f0fdf4,#f3f4f6);padding:1.5rem;">
    <button class="back-link green" id="backBtn"></button>
    <div id="headerCard"></div>
    <div class="detail-grid">
      <div class="detail-col">
        <div class="section-card">
          <div class="flex items-center justify-between mb-4">
            <div class="section-head" style="margin-bottom:0;"><div class="iconbox green"></div><h2>Test Results</h2></div>
            <button class="btn btn-green-solid" id="downloadReportBtn"></button>
          </div>
          <div class="field-grid" id="testParams" style="grid-template-columns:repeat(2,1fr);"></div>
        </div>
        <div class="section-card">
          <div class="section-head"><div class="iconbox purple"></div><h2>Allocation Summary</h2></div>
          <div id="allocations"></div>
        </div>
      </div>
      <div>
        <div class="section-card sticky-col">
          <div class="section-head"><div class="iconbox blue"></div><h2>Certificate</h2></div>
          <div id="certificateBody"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    document.getElementById('backBtn').innerHTML = icon('arrowLeft', 20) + ' Back to List';
    document.getElementById('backBtn').addEventListener('click', function () { window.location.href = 'approved-by-lab.html'; });
    document.querySelector('.iconbox.green').innerHTML = icon('flask', 20);
    document.querySelector('.iconbox.purple').innerHTML = icon('package', 20);
    document.querySelector('.iconbox.blue').innerHTML = icon('fileText', 20);
    document.getElementById('downloadReportBtn').innerHTML = icon('download', 16) + ' Download Report';
    document.getElementById('downloadReportBtn').addEventListener('click', function () {
      showToast('No PDF report is attached to this demo batch.', true);
    });

    var params = new URLSearchParams(window.location.search);
    var id = params.get('id') || (APPROVED_BY_LAB[0] && APPROVED_BY_LAB[0].id) || 'RAVTN2011TU';
    var batch = APPROVED_BY_LAB.find(function (b) { return b.id === id; }) || APPROVED_BY_LAB[0];

    document.getElementById('headerCard').innerHTML =
      '<div class="detail-header-card green mb-6"><div class="detail-header-top">' +
      '<div><h1>' + batch.id + '</h1><p class="product">' + batch.productName + '</p><p class="qty">Quantity: ' + batch.quantity + '</p></div>' +
      '<div class="text-center"><div style="width:80px;height:80px;border-radius:999px;background:linear-gradient(to bottom right,#22c55e,#16a34a);display:flex;align-items:center;justify-content:center;margin-bottom:0.5rem;"><span style="font-size:1.875rem;font-weight:700;color:#fff;">' + batch.grade + '</span></div><span style="font-size:0.75rem;color:#6b7280;">Grade</span></div>' +
      '</div></div>';

    var testParameters = [
      { name: 'Purity', value: '98.5%', status: 'Excellent', color: '#16a34a', bg: '#f0fdf4' },
      { name: 'Moisture Content', value: '8.2%', status: 'Good', color: '#16a34a', bg: '#f0fdf4' },
      { name: 'Ash Content', value: '9.5%', status: 'Acceptable', color: '#2563eb', bg: '#eff6ff' },
      { name: 'Acid Insoluble Ash', value: '1.8%', status: 'Good', color: '#16a34a', bg: '#f0fdf4' },
      { name: 'Alcohol Extractive', value: '12.5%', status: 'Good', color: '#16a34a', bg: '#f0fdf4' },
      { name: 'Water Extractive', value: '15.3%', status: 'Excellent', color: '#16a34a', bg: '#f0fdf4' }
    ];
    document.getElementById('testParams').innerHTML = testParameters.map(function (p) {
      return '<div style="padding:1rem;background:' + p.bg + ';border-radius:0.5rem;"><p class="field-label">' + p.name + '</p>' +
        '<p style="font-size:1.25rem;font-weight:700;color:#1f2937;margin:0;">' + p.value + '</p>' +
        '<p style="font-size:0.75rem;font-weight:600;color:' + p.color + ';margin:0.25rem 0 0;">' + p.status + '</p></div>';
    }).join('');

    var allocations = [
      { manufacturer: 'Himalaya Wellness', quantity: '200 kg', status: 'Allocated', purpose: 'Herbal Tea Production' },
      { manufacturer: 'Patanjali Ayurved', quantity: '180 kg', status: 'Allocated', purpose: 'Ayurvedic Medicines' },
      { manufacturer: 'Dabur India Ltd', quantity: '100 kg', status: 'Pending', purpose: 'Health Supplements' }
    ];
    document.getElementById('allocations').innerHTML = allocations.map(function (a) {
      return '<div style="padding:1rem;background:#f9fafb;border:1px solid #e5e7eb;border-radius:0.5rem;margin-bottom:0.75rem;">' +
        '<div class="flex items-start justify-between mb-2"><div><p style="font-weight:600;color:#1f2937;margin:0;">' + a.manufacturer + '</p><p style="font-size:0.875rem;color:#4b5563;margin:0;">' + a.purpose + '</p></div>' +
        '<span class="badge ' + (a.status === 'Allocated' ? 'green' : 'blue') + '">' + a.status + '</span></div>' +
        '<p style="font-size:0.875rem;color:#374151;margin:0;">Quantity: <strong>' + a.quantity + '</strong></p></div>';
    }).join('');

    document.getElementById('certificateBody').innerHTML =
      '<div style="padding:1rem;background:linear-gradient(to bottom right,#eff6ff,#faf5ff);border:2px solid #bfdbfe;border-radius:0.5rem;margin-bottom:1rem;">' +
      '<div class="text-center mb-2">' + icon('checkCircle', 48) + '</div>' +
      '<p class="text-center" style="font-size:0.875rem;color:#6b7280;margin:0 0 0.25rem;">Certificate Number</p>' +
      '<p class="text-center" style="font-weight:700;color:#1f2937;margin:0;">QT-' + batch.id + '</p></div>' +
      '<div class="field-grid" style="grid-template-columns:1fr;">' +
      '<div><p class="field-label">Issued Date</p><p class="field-value">' + batch.approvalDate + '</p></div>' +
      '<div><p class="field-label">Valid Until</p><p class="field-value">1 year from issue</p></div>' +
      '<div><p class="field-label">Issued By</p><p class="field-value">' + batch.testedBy + '</p></div>' +
      '</div>' +
      '<button class="btn btn-blue btn-full mt-4" id="certDownloadBtn">' + icon('download', 20) + ' Download Certificate</button>';
    document.getElementById('certDownloadBtn').addEventListener('click', function () {
      showToast('No certificate file is attached to this demo batch.', true);
    });
  </script>
</body>
</html>
