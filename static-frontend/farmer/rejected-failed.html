<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rejected / Failed - Farmer Portal</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</head>
<body data-page="rejectedFailed">
  <div id="app-shell"></div>

  <main class="min-h-screen" style="background:linear-gradient(to bottom right,#fef2f2,#f3f4f6);padding:1.5rem;">
    <button class="back-link red" id="backBtn"></button>
    <div class="icon-title-row">
      <div class="iconbox solid-red"></div>
      <div><h1 class="page-title" style="margin-bottom:0.25rem;">Rejected / Failed Batches</h1><p class="page-sub">Batches that were rejected or failed quality checks</p></div>
    </div>

    <div class="batch-grid" id="batchGrid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr));"></div>
  </main>

  <script>
    document.getElementById('backBtn').innerHTML = icon('arrowLeft', 20) + ' Back to Dashboard';
    document.getElementById('backBtn').addEventListener('click', function () { window.location.href = 'dashboard.html'; });
    document.querySelector('.iconbox.solid-red').innerHTML = icon('xCircle', 24);

    var batches = REJECTED_FAILED;
    var grid = document.getElementById('batchGrid');
    if (batches.length === 0) {
      grid.innerHTML = '<div class="empty-state">' + icon('checkCircle', 48) + '<p>Great! No rejected batches</p></div>';
    } else {
      grid.innerHTML = batches.map(function (b) {
        return '<div class="batch-card red" data-id="' + b.id + '">' +
          '<div class="batch-card-top"><div><h3>' + b.id + '</h3><p>' + b.productName + '</p></div>' +
          '<span class="badge red">' + b.type + '</span></div>' +
          '<div style="padding:0.75rem;background:#fef2f2;border-radius:0.5rem;margin-bottom:0.5rem;"><p style="font-size:0.75rem;color:#dc2626;margin:0 0 0.25rem;">Reason</p><p style="font-size:0.875rem;font-weight:600;color:#991b1b;margin:0;">' + b.reason + '</p></div>' +
          '<div class="batch-row between"><span>Rejected Date:</span><span style="font-weight:600;color:#1f2937;">' + b.rejectedDate + '</span></div>' +
          '<div class="batch-row between"><span>Rejected By:</span><span style="font-weight:600;color:#1f2937;text-align:right;">' + b.rejectedBy + '</span></div>' +
          '</div>';
      }).join('');
      grid.querySelectorAll('.batch-card').forEach(function (card) {
        card.addEventListener('click', function () {
          window.location.href = 'rejected-failed-detail.html?id=' + encodeURIComponent(card.getAttribute('data-id'));
        });
      });
    }
  </script>
</body>
</html>
