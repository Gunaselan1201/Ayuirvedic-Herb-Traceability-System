<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Farmer Portal</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</head>
<body data-page="dashboard">
  <div id="app-shell"></div>

  <main class="min-h-screen" style="background:#fff;padding:1.5rem;">
    <div class="max-w-7xl">
      <div class="mb-6">
        <h1 class="page-title" id="welcomeHeading">Welcome back</h1>
        <p class="page-sub">Monitor and manage your herb batches throughout the supply chain</p>
      </div>

      <div class="stat-row">
        <div class="stat-card indigo">
          <div><p class="label">Total Batches</p><p class="value" id="statTotal">0</p></div>
          <div class="icon-wrap indigo"></div>
        </div>
        <div class="stat-card orange">
          <div><p class="label">Success Rate</p><p class="value" id="statSuccess">0%</p></div>
          <div class="icon-wrap orange"></div>
        </div>
        <div class="stat-card teal">
          <div><p class="label">Pending Tests</p><p class="value" id="statPending">0</p></div>
          <div class="icon-wrap teal"></div>
        </div>
      </div>

      <div class="hub-grid" id="hubGrid"></div>
    </div>
  </main>

  <script>
    var farmer = getFarmerData();
    document.getElementById('welcomeHeading').textContent = 'Welcome back, ' + farmer.farmerName;

    document.getElementById('statTotal').textContent = DASHBOARD_STATS.totalBatches;
    document.getElementById('statSuccess').textContent = DASHBOARD_STATS.successRate + '%';
    document.getElementById('statPending').textContent = DASHBOARD_STATS.pendingTests;
    document.querySelectorAll('.stat-card.indigo .icon-wrap').forEach(function (n) { n.innerHTML = icon('trendingUp', 24); });
    document.querySelectorAll('.stat-card.orange .icon-wrap').forEach(function (n) { n.innerHTML = icon('package', 24); });
    document.querySelectorAll('.stat-card.teal .icon-wrap').forEach(function (n) { n.innerHTML = icon('clock', 24); });

    var HUB_CARDS = [
      { id: 'sentForTesting', title: 'Sent for Testing', count: DASHBOARD_STATS.sentForTesting, iconName: 'flask', color: 'blue', href: 'sent-for-testing.html' },
      { id: 'approvedByLab', title: 'Approved by Lab', count: DASHBOARD_STATS.approvedByLab, iconName: 'checkCircle', color: 'green', href: 'approved-by-lab.html' },
      { id: 'sentToManufacturing', title: 'Sent to Manufacturing', count: DASHBOARD_STATS.sentToManufacturing, iconName: 'factory', color: 'purple', href: 'sent-to-manufacturing.html' },
      { id: 'rejectedFailed', title: 'Rejected / Failed', count: DASHBOARD_STATS.rejectedFailed, iconName: 'xCircle', color: 'red', href: 'rejected-failed.html' }
    ];

    var hubGrid = document.getElementById('hubGrid');
    hubGrid.innerHTML = HUB_CARDS.map(function (c) {
      return '<div class="hub-card ' + c.color + '" data-href="' + c.href + '">' +
        '<div class="icon">' + icon(c.iconName, 48) + '</div>' +
        '<h3>' + c.title + '</h3>' +
        '<p class="count">' + c.count + '</p>' +
        '</div>';
    }).join('');
    hubGrid.querySelectorAll('.hub-card').forEach(function (card) {
      card.addEventListener('click', function () { window.location.href = card.getAttribute('data-href'); });
    });
  </script>
</body>
</html>
