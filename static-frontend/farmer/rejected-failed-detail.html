<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batch Detail - Rejected / Failed</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</head>
<body data-page="rejectedFailedDetail">
  <div id="app-shell"></div>

  <main class="min-h-screen" style="background:linear-gradient(to bottom right,#fef2f2,#f3f4f6);padding:1.5rem;">
    <button class="back-link red" id="backBtn"></button>
    <div id="headerCard"></div>
    <div class="detail-grid">
      <div class="detail-col">
        <div class="section-card red-tint">
          <div class="section-head"><div class="iconbox red"></div><h2 style="color:#991b1b;">Rejection Reason</h2></div>
          <div style="padding:1rem;background:#fff;border:1px solid #fecaca;border-radius:0.5rem;margin-bottom:1rem;"><p style="font-size:1.125rem;font-weight:600;color:#991b1b;margin:0;" id="reasonMain"></p></div>
          <div style="padding:1rem;background:#fff;border:1px solid #fecaca;border-radius:0.5rem;"><p style="font-size:0.875rem;color:#6b7280;margin:0 0 0.5rem;">Detailed Explanation:</p><p style="color:#1f2937;margin:0;" id="reasonDetail"></p></div>
        </div>
        <div class="section-card">
          <div class="section-head"><div class="iconbox orange"></div><h2>Grade Evaluation Report</h2></div>
          <div class="field-grid" id="gradeEval"></div>
        </div>
        <div class="section-card yellow-tint">
          <div class="section-head"><div class="iconbox" style="background:#fef9c3;color:#ca8a04;"></div><h2 style="color:#854d0e;">Recommendations for Improvement</h2></div>
          <ul id="recsList" style="display:flex;flex-direction:column;gap:0.5rem;"></ul>
        </div>
      </div>
      <div>
        <div class="section-card sticky-col">
          <div class="section-head"><div class="iconbox blue"></div><h2>Inspector Details</h2></div>
          <div id="inspectorBody"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    document.getElementById('backBtn').innerHTML = icon('arrowLeft', 20) + ' Back to List';
    document.getElementById('backBtn').addEventListener('click', function () { window.location.href = 'rejected-failed.html'; });
    document.querySelector('.iconbox.red').innerHTML = icon('alertTriangle', 20);
    document.querySelector('.iconbox.orange').innerHTML = icon('fileText', 20);
    document.querySelector('.section-card.yellow-tint .iconbox').innerHTML = icon('award', 20);
    document.querySelector('.iconbox.blue').innerHTML = icon('user', 20);

    var params = new URLSearchParams(window.location.search);
    var id = params.get('id') || (REJECTED_FAILED[0] && REJECTED_FAILED[0].id) || 'RAVTN2210TU';
    var batch = REJECTED_FAILED.find(function (b) { return b.id === id; }) || REJECTED_FAILED[0];

    document.getElementById('headerCard').innerHTML =
      '<div class="detail-header-card red mb-6"><div class="detail-header-top">' +
      '<div><h1>' + batch.id + '</h1><p class="product">' + batch.productName + '</p><p class="qty">Quantity: 350 kg</p></div>' +
      '<div class="text-center"><div style="width:64px;height:64px;border-radius:999px;background:#ef4444;display:flex;align-items:center;justify-content:center;margin-bottom:0.5rem;">' + icon('xCircle', 32) + '</div><span style="font-size:0.75rem;color:#dc2626;font-weight:600;">' + batch.type.toUpperCase() + '</span></div>' +
      '</div></div>';
    document.querySelector('.detail-header-card .text-center div').style.color = '#fff';

    document.getElementById('reasonMain').textContent = batch.reason;
    document.getElementById('reasonDetail').textContent = 'During quality inspection, batch ' + batch.id + ' (' + batch.productName + ') was flagged: ' + batch.reason + '. This does not meet the acceptable quality threshold and the batch has been marked as ' + batch.type.toLowerCase() + '.';

    document.getElementById('gradeEval').innerHTML =
      '<div style="padding:1rem;background:#f9fafb;border-radius:0.5rem;"><p class="field-label">Original Grade</p><p style="font-size:1.5rem;font-weight:700;color:#1f2937;margin:0;">' + batch.grade + '</p></div>' +
      '<div style="padding:1rem;background:#fef2f2;border:1px solid #fecaca;border-radius:0.5rem;"><p style="font-size:0.875rem;color:#dc2626;margin:0 0 0.25rem;">Evaluated Grade</p><p style="font-size:1.5rem;font-weight:700;color:#b91c1c;margin:0;">' + batch.grade + '- (Downgraded)</p></div>' +
      '<div style="padding:1rem;background:#f9fafb;border-radius:0.5rem;"><p class="field-label">Purity Level</p><p class="field-value">88.5%</p></div>' +
      '<div style="padding:1rem;background:#fef2f2;border:1px solid #fecaca;border-radius:0.5rem;"><p style="font-size:0.875rem;color:#dc2626;margin:0 0 0.25rem;">Moisture Content</p><p style="font-size:1.125rem;font-weight:600;color:#b91c1c;margin:0;">12.3%</p></div>' +
      '<div class="full" style="padding:1rem;background:#f9fafb;border-radius:0.5rem;"><p class="field-label">Contamination Level</p><p class="field-value">Low</p></div>';

    var recs = [
      'Improve the drying process to achieve optimal moisture levels',
      'Ensure proper storage conditions before dispatch',
      'Consider implementing quality checks before sending to manufacturer',
      'Review harvest timing and post-harvest handling procedures'
    ];
    document.getElementById('recsList').innerHTML = recs.map(function (r, i) {
      return '<li style="display:flex;align-items:flex-start;gap:0.75rem;padding:0.75rem;background:#fff;border-radius:0.5rem;">' +
        '<span style="flex-shrink:0;width:24px;height:24px;border-radius:999px;background:#eab308;color:#fff;display:flex;align-items:center;justify-content:center;font-size:0.875rem;font-weight:700;">' + (i + 1) + '</span>' +
        '<p style="margin:0;color:#1f2937;">' + r + '</p></li>';
    }).join('');

    document.getElementById('inspectorBody').innerHTML =
      '<div style="display:flex;flex-direction:column;gap:1rem;">' +
      '<div style="padding:1rem;background:#f9fafb;border-radius:0.5rem;"><p class="field-label">Inspector Name</p><p class="field-value">Dr. Rajesh Kumar</p></div>' +
      '<div style="padding:1rem;background:#f9fafb;border-radius:0.5rem;"><p class="field-label">Inspector ID</p><p class="field-value">QC-' + batch.id.substring(0, 6) + '</p></div>' +
      '<div style="padding:1rem;background:#f9fafb;border-radius:0.5rem;"><p class="field-label">Rejected By</p><p class="field-value">' + batch.rejectedBy + '</p></div>' +
      '<div style="padding:1rem;background:#f9fafb;border-radius:0.5rem;"><p class="field-label">Rejection Date</p><p class="field-value">' + batch.rejectedDate + '</p></div>' +
      '<div style="padding-top:1rem;border-top:1px solid #e5e7eb;"><button class="btn btn-red btn-full" id="reevalBtn">Request Re-evaluation</button></div>' +
      '</div>';
    document.getElementById('reevalBtn').addEventListener('click', function () {
      showToast('Re-evaluation request submitted for ' + batch.id + '.');
    });
  </script>
</body>
</html>
