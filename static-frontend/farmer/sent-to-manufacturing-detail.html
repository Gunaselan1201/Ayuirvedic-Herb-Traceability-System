<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batch Detail - Sent to Manufacturing</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</head>
<body data-page="sentToManufacturingDetail">
  <div id="app-shell"></div>

  <main class="min-h-screen" style="background:linear-gradient(to bottom right,#faf5ff,#f3f4f6);padding:1.5rem;">
    <button class="back-link purple" id="backBtn"></button>
    <div id="headerCard"></div>
    <div class="detail-grid">
      <div class="detail-col">
        <div class="section-card">
          <div class="section-head"><div class="iconbox purple"></div><h2>Manufacturer Information</h2></div>
          <div class="field-grid" id="mfgFields"></div>
        </div>
        <div class="section-card">
          <div class="section-head"><div class="iconbox green"></div><h2>Transfer Details</h2></div>
          <div class="field-grid" id="transferFields"></div>
        </div>
      </div>
      <div>
        <div class="section-card sticky-col">
          <div class="section-head"><div class="iconbox" style="background:#fef9c3;color:#ca8a04;"></div><h2>Grade Information</h2></div>
          <div id="gradeBody"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    document.getElementById('backBtn').innerHTML = icon('arrowLeft', 20) + ' Back to List';
    document.getElementById('backBtn').addEventListener('click', function () { window.location.href = 'sent-to-manufacturing.html'; });
    document.querySelector('.iconbox.purple').innerHTML = icon('factory', 20);
    document.querySelector('.iconbox.green').innerHTML = icon('package', 20);
    document.querySelector('.section-card .iconbox[style]').innerHTML = icon('award', 20);

    var MANUFACTURER_INFO = {
      'Himalaya Wellness Company': { address: 'Makali, Bangalore - 562162, Karnataka', contact: '+91 80 2374 0585', email: 'quality@himalayawellness.com', reg: 'MFG-KAR-2024-00567' },
      'Dabur India Ltd': { address: 'Sahibabad Industrial Area, Ghaziabad - 201010, UP', contact: '+91 120 396 6666', email: 'quality@dabur.com', reg: 'MFG-UP-2024-00891' },
      'Patanjali Ayurved': { address: 'Patanjali Food & Herbal Park, Haridwar - 249405, Uttarakhand', contact: '+91 1334 240 000', email: 'quality@patanjaliayurved.org', reg: 'MFG-UK-2024-00234' }
    };

    var params = new URLSearchParams(window.location.search);
    var id = params.get('id') || (SENT_TO_MANUFACTURING[0] && SENT_TO_MANUFACTURING[0].id) || 'RAVTN2011TU';
    var batch = SENT_TO_MANUFACTURING.find(function (b) { return b.id === id; }) || SENT_TO_MANUFACTURING[0];
    var mfg = MANUFACTURER_INFO[batch.manufacturer] || { address: 'Address on file', contact: 'N/A', email: 'N/A', reg: 'N/A' };

    document.getElementById('headerCard').innerHTML =
      '<div class="detail-header-card purple mb-6"><div class="detail-header-top">' +
      '<div><h1>' + batch.id + '</h1><p class="product">' + batch.productName + '</p><p class="qty">Quantity: ' + batch.quantity + '</p></div>' +
      '<span class="badge green" style="padding:0.5rem 1rem;font-size:0.875rem;">Accepted</span>' +
      '</div></div>';

    document.getElementById('mfgFields').innerHTML =
      '<div class="full"><div class="flex items-center gap-2 mb-1">' + icon('building', 16) + '<span class="field-label" style="margin:0;">Company Name</span></div><p style="font-weight:600;color:#1f2937;font-size:1.125rem;margin:0;">' + batch.manufacturer + '</p></div>' +
      '<div class="full"><div class="flex items-center gap-2 mb-1">' + icon('mapPin', 16) + '<span class="field-label" style="margin:0;">Address</span></div><p class="field-value">' + mfg.address + '</p></div>' +
      '<div><div class="flex items-center gap-2 mb-1">' + icon('phone', 16) + '<span class="field-label" style="margin:0;">Contact</span></div><p class="field-value">' + mfg.contact + '</p></div>' +
      '<div><div class="flex items-center gap-2 mb-1">' + icon('mail', 16) + '<span class="field-label" style="margin:0;">Email</span></div><p class="field-value">' + mfg.email + '</p></div>' +
      '<div class="full"><div class="flex items-center gap-2 mb-1">' + icon('fileText', 16) + '<span class="field-label" style="margin:0;">Registration Number</span></div><p class="field-value">' + mfg.reg + '</p></div>';

    document.getElementById('transferFields').innerHTML =
      '<div><p class="field-label">Purpose</p><p class="field-value">Herbal / Ayurvedic Product Manufacturing</p></div>' +
      '<div><p class="field-label">Received Date</p><p class="field-value">' + batch.dateSent + '</p></div>' +
      '<div><p class="field-label">Inspection Status</p><p style="font-weight:600;color:#16a34a;margin:0;">Passed</p></div>' +
      '<div><p class="field-label">Accepted Quantity</p><p class="field-value">' + batch.quantity + '</p></div>' +
      '<div><p class="field-label">Grade Verified</p><p style="font-weight:600;color:#16a34a;font-size:1.125rem;margin:0;">' + batch.grade + '</p></div>';

    document.getElementById('gradeBody').innerHTML =
      '<div class="text-center mb-6">' +
      '<div style="width:96px;height:96px;margin:0 auto 0.75rem;border-radius:999px;background:linear-gradient(to bottom right,#22c55e,#16a34a);display:flex;align-items:center;justify-content:center;">' +
      '<span style="font-size:2.25rem;font-weight:700;color:#fff;">' + batch.grade + '</span></div>' +
      '<p style="font-size:0.875rem;color:#4b5563;margin:0;">Allocated Grade</p></div>' +
      '<div style="display:flex;flex-direction:column;gap:0.75rem;">' +
      '<div style="padding:0.75rem;background:#f9fafb;border-radius:0.5rem;"><p class="field-label">Batch ID</p><p class="field-value">' + batch.id + '</p></div>' +
      '<div style="padding:0.75rem;background:#f9fafb;border-radius:0.5rem;"><p class="field-label">Product</p><p class="field-value">' + batch.productName + '</p></div>' +
      '<div style="padding:0.75rem;background:#f9fafb;border-radius:0.5rem;"><p class="field-label">Quantity Sent</p><p class="field-value">' + batch.quantity + '</p></div>' +
      '<div style="padding:0.75rem;background:#f9fafb;border-radius:0.5rem;"><p class="field-label">Date Sent</p><p class="field-value">' + batch.dateSent + '</p></div>' +
      '</div>';
  </script>
</body>
</html>
