<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Product - Farmer Portal</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</head>
<body data-page="form">
  <div id="app-shell"></div>

  <main class="max-w-7xl" style="padding: 3rem 1.5rem;">
    <button class="back-link gray" id="backBtn"></button>

    <div id="batchIdBadgeWrap" class="hidden mb-6"></div>

    <form id="productForm" class="form-grid">
      <!-- Left Column -->
      <div class="form-col">
        <div class="field">
          <label for="productName">Product Name</label>
          <select id="productName" name="productName" required>
            <option>Tulsi (Holy Basil)</option>
            <option>Wheat</option>
            <option>Rice</option>
            <option>Cotton</option>
            <option>Neem</option>
            <option>Turmeric</option>
            <option>Ashwagandha</option>
          </select>
        </div>

        <div class="form-row-2">
          <div class="field">
            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" name="quantity" value="05" required>
          </div>
          <div class="field">
            <label for="unit">Unit</label>
            <select id="unit" name="unit" required>
              <option>Ton</option>
              <option>Kg</option>
              <option>Quintal</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="harvestedDate">Harvested Date</label>
          <input type="date" id="harvestedDate" name="harvestedDate" value="2025-09-26" required>
        </div>

        <div class="form-row-2">
          <div class="field">
            <label for="longitude">Longitude</label>
            <input type="text" id="longitude" name="longitude" value="11.0150" required>
          </div>
          <div class="field">
            <label for="latitude">Latitude</label>
            <input type="text" id="latitude" name="latitude" value="78.2980" required>
          </div>
        </div>

        <div class="field">
          <label for="villageTown">Village/Town</label>
          <input type="text" id="villageTown" name="villageTown" value="Mohanur" required>
        </div>

        <div class="field">
          <label for="district">District</label>
          <input type="text" id="district" name="district" value="Namakkal" required>
        </div>
      </div>

      <!-- Right Column -->
      <div class="form-col">
        <div>
          <h3 style="color:#1f2937;font-weight:600;margin-bottom:0.75rem;font-size:1.125rem;">Geo Tag Photo (3 Photos)</h3>
          <div class="photo-grid" id="photoGrid"></div>
        </div>

        <div class="field">
          <label for="state">State</label>
          <select id="state" name="state" required>
            <option>Tamil Nadu (TN)</option>
            <option>Karnataka (KA)</option>
            <option>Kerala (KL)</option>
          </select>
        </div>

        <div class="field">
          <label for="addedBy">Added By</label>
          <input type="text" id="addedBy" name="addedBy" value="Gunaselan" required>
        </div>

        <div class="field">
          <label for="dateTime">Date &amp; Time</label>
          <input type="text" id="dateTime" name="dateTime" value="28/09/2025, 04:31 pm" required>
        </div>

        <button type="submit" class="btn btn-green btn-full btn-lg" id="submitBtn">Submit</button>
      </div>
    </form>
  </main>

  <script>
    document.getElementById('backBtn').innerHTML = icon('chevronLeft', 20) + ' Back to Dashboard';
    document.getElementById('backBtn').addEventListener('click', function () { window.location.href = 'dashboard.html'; });

    // Three geo-tag photo upload slots (mirrors the React upload/preview UI)
    var photoState = [null, null, null];
    function renderPhotoGrid() {
      var grid = document.getElementById('photoGrid');
      grid.innerHTML = [0, 1, 2].map(function (i) {
        if (photoState[i]) {
          return '<div class="photo-box" data-idx="' + i + '">' +
            '<span class="photo-tag">Photo ' + (i + 1) + '</span>' +
            '<img src="' + photoState[i] + '" alt="Preview ' + (i + 1) + '">' +
            '<button type="button" class="remove-btn" data-remove="' + i + '">' + icon('x', 16) + '</button>' +
            '<span class="uploaded-badge">' + icon('checkCircle', 12) + ' Uploaded</span>' +
            '</div>';
        }
        return '<label class="photo-box" data-idx="' + i + '">' +
          '<span class="photo-tag">Photo ' + (i + 1) + '</span>' +
          '<input type="file" accept="image/*" class="hidden" data-upload="' + i + '">' +
          '<span class="upload-icon">' + icon('upload', 24) + '</span>' +
          '<p class="upload-text">Upload Photo</p>' +
          '<p class="upload-sub">Click to browse</p>' +
          '</label>';
      }).join('');

      grid.querySelectorAll('[data-upload]').forEach(function (input) {
        input.addEventListener('change', function (e) {
          var idx = Number(input.getAttribute('data-upload'));
          var file = e.target.files[0];
          if (!file) return;
          if (file.size > 5000000) { showToast('File too large (max 5MB)', true); return; }
          var reader = new FileReader();
          reader.onloadend = function () {
            photoState[idx] = reader.result;
            renderPhotoGrid();
          };
          reader.readAsDataURL(file);
        });
      });
      grid.querySelectorAll('[data-remove]').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          e.preventDefault();
          var idx = Number(btn.getAttribute('data-remove'));
          photoState[idx] = null;
          renderPhotoGrid();
        });
      });
    }
    renderPhotoGrid();

    document.getElementById('productForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var farmer = getFarmerData();
      var productName = document.getElementById('productName').value;
      var state = document.getElementById('state').value;
      var batchId = computeBatchId(farmer.farmerId, state, productName);

      var badgeWrap = document.getElementById('batchIdBadgeWrap');
      badgeWrap.innerHTML = '<div class="batch-id-badge">' + icon('checkCircle', 24) +
        '<div><p class="label">Generated Batch ID:</p><p class="id">' + batchId + '</p></div></div>';
      badgeWrap.classList.remove('hidden');

      showToast('Batch ID ' + batchId + ' created and stored successfully.');

      setTimeout(function () {
        document.getElementById('productForm').reset();
        photoState = [null, null, null];
        renderPhotoGrid();
        badgeWrap.classList.add('hidden');
        badgeWrap.innerHTML = '';
        window.location.href = 'dashboard.html';
      }, 1800);
    });
  </script>
</body>
</html>
