<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sent to Manufacturing - Farmer Portal</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</head>
<body data-page="sentToManufacturing">
  <div id="app-shell"></div>

  <main class="min-h-screen" style="background:linear-gradient(to bottom right,#faf5ff,#f3f4f6);padding:1.5rem;">
    <button class="back-link purple" id="backBtn"></button>
    <div class="icon-title-row">
      <div class="iconbox solid-purple"></div>
      <div><h1 class="page-title" style="margin-bottom:0.25rem;">Sent to Manufacturing</h1><p class="page-sub">Batches forwarded to manufacturing units</p></div>
    </div>

    <div class="stat-row" style="grid-template-columns:repeat(4,1fr);" id="statsRow"></div>

    <div class="batch-grid" id="batchGrid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr));"></div>
  </main>

  <script>
    document.getElementById('backBtn').innerHTML = icon('arrowLeft', 20) + ' Back to Dashboard';
    document.getElementById('backBtn').addEventListener('click', function () { window.location.href = 'dashboard.html'; });
    document.querySelector('.iconbox.solid-purple').innerHTML = icon('factory', 24);

    var batches = SENT_TO_MANUFACTURING;
    document.getElementById('statsRow').innerHTML =
      '<div class="card" style="padding:1rem;"><div class="flex items-center gap-2 mb-1"><span style="color:#6b7280;">' + icon('package', 16) + '</span><span style="font-size:0.875rem;color:#6b7280;">Total</span></div><p style="font-size:1.5rem;font-weight:700;margin:0;">' + batches.length + '</p></div>' +
      '<div class="card" style="padding:1rem;"><div class="flex items-center gap-2 mb-1"><span style="color:#22c55e;">' + icon('checkCircle', 16) + '</span><span style="font-size:0.875rem;color:#6b7280;">Accepted</span></div><p style="font-size:1.5rem;font-weight:700;color:#16a34a;margin:0;">0</p></div>' +
      '<div class="card" style="padding:1rem;"><div class="flex items-center gap-2 mb-1"><span style="color:#3b82f6;">' + icon('clock', 16) + '</span><span style="font-size:0.875rem;color:#6b7280;">Processing</span></div><p style="font-size:1.5rem;font-weight:700;color:#2563eb;margin:0;">' + batches.length + '</p></div>' +
      '<div class="card" style="padding:1rem;"><div class="flex items-center gap-2 mb-1"><span style="color:#ef4444;">' + icon('xCircle', 16) + '</span><span style="font-size:0.875rem;color:#6b7280;">Rejected</span></div><p style="font-size:1.5rem;font-weight:700;color:#dc2626;margin:0;">0</p></div>';

    var grid = document.getElementById('batchGrid');
    if (batches.length === 0) {
      grid.innerHTML = '<div class="empty-state">No batches sent to manufacturing yet</div>';
    } else {
      grid.innerHTML = batches.map(function (b) {
        return '<div class="batch-card purple" data-id="' + b.id + '">' +
          '<div class="batch-card-top"><div><h3>' + b.id + '</h3><p>' + b.productName + '</p></div>' +
          '<span class="badge purple">Sent to Manufacturing</span></div>' +
          '<div class="batch-row between"><span>Manufacturer:</span><span style="font-weight:600;color:#1f2937;text-align:right;">' + b.manufacturer + '</span></div>' +
          '<div class="batch-row between"><span>Date Sent:</span><span style="font-weight:600;color:#1f2937;">' + b.dateSent + '</span></div>' +
          '<div class="batch-row between"><span>Quantity:</span><span style="font-weight:600;color:#1f2937;">' + b.quantity + '</span></div>' +
          '<div class="batch-row between"><span>Grade:</span><span style="font-weight:600;color:#16a34a;">' + b.grade + '</span></div>' +
          '</div>';
      }).join('');
      grid.querySelectorAll('.batch-card').forEach(function (card) {
        card.addEventListener('click', function () {
          window.location.href = 'sent-to-manufacturing-detail.html?id=' + encodeURIComponent(card.getAttribute('data-id'));
        });
      });
    }
  </script>
</body>
</html>
