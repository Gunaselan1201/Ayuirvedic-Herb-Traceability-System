<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order History - Farmer Portal</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</head>
<body data-page="lastOrders">
  <div id="app-shell"></div>

  <main class="min-h-screen" style="background:#fff;padding:1.5rem;">
    <div class="max-w-7xl">
      <button class="back-link gray" id="backBtn"></button>
      <div class="flex items-center justify-between mb-6">
        <h1 class="page-title" style="margin:0;">Order History</h1>
        <button class="btn btn-blue" id="exportBtn"></button>
      </div>
      <div class="search-wrap">
        <span id="searchIcon"></span>
        <input type="text" id="searchInput" placeholder="Search by product or batch ID">
      </div>
      <div id="ordersList"></div>
    </div>
  </main>

  <script>
    document.getElementById('backBtn').innerHTML = icon('arrowLeft', 20) + ' Back';
    document.getElementById('backBtn').addEventListener('click', function () { window.location.href = 'dashboard.html'; });
    document.getElementById('exportBtn').innerHTML = icon('download', 16) + ' Export All';
    document.getElementById('exportBtn').addEventListener('click', function () { showToast('Export is not available in this offline demo.'); });
    document.getElementById('searchIcon').innerHTML = icon('search', 20);

    var orders = LAST_ORDERS.slice().sort(function (a, b) { return new Date(b.dateTime) - new Date(a.dateTime); });

    function render(term) {
      var list = document.getElementById('ordersList');
      var filtered = orders.filter(function (o) {
        var t = (term || '').toLowerCase();
        return o.productName.toLowerCase().indexOf(t) !== -1 || o.id.toLowerCase().indexOf(t) !== -1;
      });
      if (filtered.length === 0) {
        list.innerHTML = '<div class="empty-illustration">' + icon('archive', 64) + '<p>No order history available</p></div>';
        return;
      }
      list.innerHTML = filtered.map(function (o, idx) {
        var d = new Date(o.dateTime);
        var isLast = idx === 0 && !term;
        return '<div class="history-item' + (isLast ? ' last' : '') + '">' +
          (isLast ? '<div class="flex items-center gap-3"><span class="last-badge">Last Submitted</span><div class="iconbox">' + icon('archive', 24) + '</div></div>' : '<div class="iconbox">' + icon('archive', 20) + '</div>') +
          '<div class="history-item-grid">' +
          '<div><p class="k">Product Name</p><p class="v">' + o.productName + '</p></div>' +
          '<div><p class="k">Batch ID</p><p class="v">' + o.id + '</p></div>' +
          '<div><p class="k">Quantity</p><p class="v">' + o.quantity + ' ' + o.unit + '</p></div>' +
          '<div><p class="k">Date &amp; Time</p><p class="v">' + d.toLocaleDateString('en-GB') + '</p><p class="k" style="margin-top:0.15rem;">' + d.toLocaleTimeString('en-GB') + '</p></div>' +
          '</div></div>';
      }).join('');
    }
    render('');
    document.getElementById('searchInput').addEventListener('input', function (e) { render(e.target.value); });
  </script>
</body>
</html>
