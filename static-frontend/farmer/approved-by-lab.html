<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Approved by Lab - Farmer Portal</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</head>
<body data-page="approvedByLab">
  <div id="app-shell"></div>

  <main class="min-h-screen" style="background:linear-gradient(to bottom right,#f0fdf4,#f3f4f6);padding:1.5rem;">
    <button class="back-link green" id="backBtn"></button>
    <div class="icon-title-row">
      <div class="iconbox solid-green"></div>
      <div><h1 class="page-title" style="margin-bottom:0.25rem;">Approved by Lab</h1><p class="page-sub">Batches that passed quality testing</p></div>
    </div>

    <div class="stat-row" style="grid-template-columns:repeat(4,1fr);" id="statsRow"></div>

    <div class="batch-grid" id="batchGrid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr));"></div>
  </main>

  <script>
    document.getElementById('backBtn').innerHTML = icon('arrowLeft', 20) + ' Back to Dashboard';
    document.getElementById('backBtn').addEventListener('click', function () { window.location.href = 'dashboard.html'; });
    document.querySelector('.iconbox.solid-green').innerHTML = icon('checkCircle', 24);

    var batches = APPROVED_BY_LAB;
    var gradeA = batches.filter(function (b) { return b.grade === 'A'; }).length;
    var gradeB = batches.filter(function (b) { return b.grade === 'B'; }).length;
    var gradeC = batches.filter(function (b) { return b.grade === 'C'; }).length;

    document.getElementById('statsRow').innerHTML =
      '<div class="card" style="padding:1rem;"><div class="flex items-center gap-2 mb-1"><span style="color:#6b7280;">' + icon('package', 16) + '</span><span style="font-size:0.875rem;color:#6b7280;">Total Approved</span></div><p style="font-size:1.5rem;font-weight:700;margin:0;">' + batches.length + '</p></div>' +
      '<div class="card" style="padding:1rem;background:linear-gradient(to bottom right,#22c55e,#16a34a);color:#fff;"><div class="flex items-center gap-2 mb-1">' + icon('star', 16) + '<span style="font-size:0.875rem;">Grade A (Excellent)</span></div><p style="font-size:1.5rem;font-weight:700;margin:0;">' + gradeA + '</p></div>' +
      '<div class="card" style="padding:1rem;background:linear-gradient(to bottom right,#3b82f6,#2563eb);color:#fff;"><div class="flex items-center gap-2 mb-1">' + icon('award', 16) + '<span style="font-size:0.875rem;">Grade B (Good)</span></div><p style="font-size:1.5rem;font-weight:700;margin:0;">' + gradeB + '</p></div>' +
      '<div class="card" style="padding:1rem;background:linear-gradient(to bottom right,#f97316,#ea580c);color:#fff;"><div class="flex items-center gap-2 mb-1">' + icon('checkCircle', 16) + '<span style="font-size:0.875rem;">Grade C (Conditional)</span></div><p style="font-size:1.5rem;font-weight:700;margin:0;">' + gradeC + '</p></div>';

    function gradeColor(g) {
      if (g === 'A') return { text: '#16a34a', bg: '#f0fdf4' };
      if (g === 'B') return { text: '#2563eb', bg: '#eff6ff' };
      return { text: '#ea580c', bg: '#fff7ed' };
    }

    var grid = document.getElementById('batchGrid');
    if (batches.length === 0) {
      grid.innerHTML = '<div class="empty-state">No approved batches yet</div>';
    } else {
      grid.innerHTML = batches.map(function (b) {
        var gc = gradeColor(b.grade);
        var decisionLabel = b.approvalDecision === 'approve' ? 'Manually Approved' : (b.approvalDecision === 'auto_approved' ? 'Auto Approved' : '');
        return '<div class="batch-card green" data-id="' + b.id + '">' +
          '<div class="batch-card-top"><div><h3>' + b.id + '</h3><p>' + b.productName + '</p></div>' +
          '<div style="padding:0.25rem 0.75rem;border-radius:0.5rem;background:' + gc.bg + ';color:' + gc.text + ';font-weight:700;font-size:1.25rem;">' + b.grade + '</div></div>' +
          '<div class="batch-row between"><span>Test Date:</span><span style="font-weight:600;color:#1f2937;">' + b.testDate + '</span></div>' +
          '<div class="batch-row between"><span>Tested By:</span><span style="font-weight:600;color:#1f2937;">' + b.testedBy + '</span></div>' +
          '<div class="batch-row between"><span>Quantity:</span><span style="font-weight:600;color:#1f2937;">' + b.quantity + '</span></div>' +
          (decisionLabel ? '<div class="batch-row between"><span>Decision:</span><span style="font-weight:600;color:' + (b.approvalDecision === 'approve' ? '#16a34a' : '#2563eb') + ';">' + decisionLabel + '</span></div>' : '') +
          '<div class="batch-card-footer"><div style="text-align:center;color:#9ca3af;font-size:0.875rem;">PDF report not available</div></div>' +
          '</div>';
      }).join('');
      grid.querySelectorAll('.batch-card').forEach(function (card) {
        card.addEventListener('click', function () {
          window.location.href = 'approved-by-lab-detail.html?id=' + encodeURIComponent(card.getAttribute('data-id'));
        });
      });
    }
  </script>
</body>
</html>
