<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test New Batch - Lab Portal</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app-shell"></div>
<main class="bg-orange-amber page">
  <div class="page-inner">
    <button class="back-link" onclick="window.history.back()" id="backBtnIcon"></button>
    <div class="page-title-row">
      <div class="page-icon-square" style="background:#fb923c;" id="titleIconWrap"></div>
      <div>
        <h1>Pending Tests</h1>
        <p class="page-header-sub" style="margin:0;">Batches currently awaiting quality testing</p>
      </div>
    </div>

    <div class="grid grid-4 mb-6" style="margin-top:1rem;">
      <div class="stat-tile"><div class="stat-head" id="s1"></div><p class="stat-value" id="statTotal">0</p></div>
      <div class="stat-tile"><div class="stat-head" id="s2"></div><p class="stat-value" style="color:var(--lab-blue-600);">2</p></div>
      <div class="stat-tile"><div class="stat-head" id="s3"></div><p class="stat-value" style="color:var(--purple-600);">4</p></div>
      <div class="stat-tile"><div class="stat-head" id="s4"></div><p class="stat-value" style="color:var(--orange-500);">2</p></div>
    </div>

    <div id="batchGrid" class="grid grid-2"></div>
    <div id="emptyState" class="hidden"></div>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  const auth = initLabShell('test-new');
  if (auth) {
    document.getElementById('backBtnIcon').innerHTML = icon('arrowleft') + '<span>Back</span>';
    document.getElementById('titleIconWrap').innerHTML = icon('flask');
    document.getElementById('s1').innerHTML = icon('flask') + '<span>Total Batches</span>';
    document.getElementById('s2').innerHTML = icon('upload') + '<span>In Transit</span>';
    document.getElementById('s3').innerHTML = icon('flask') + '<span>Testing</span>';
    document.getElementById('s4').innerHTML = icon('calendar') + '<span>Awaiting</span>';

    const pending = LAB_BATCHES.filter(function (b) { return b.status === 'PENDING'; });
    document.getElementById('statTotal').textContent = pending.length;

    if (pending.length === 0) {
      document.getElementById('batchGrid').classList.add('hidden');
      const empty = document.getElementById('emptyState');
      empty.classList.remove('hidden');
      empty.innerHTML = '<div class="empty-state">' + icon('flask', 'icon-lg') +
        '<h2>No Pending Batches</h2><p>All batches have been tested!</p></div>';
    } else {
      document.getElementById('batchGrid').innerHTML = pending.map(function (b) {
        return '<div class="batch-item pending-card">' +
          '<div class="batch-item-head">' +
            '<div><h3>' + b.id + '</h3><p class="batch-product">' + b.productName + '</p></div>' +
            '<span class="badge badge-orange">Pending Test</span>' +
          '</div>' +
          '<div>' +
            '<div class="batch-row">' + icon('calendar') + '<span>Sent: ' + labFormatDate(b.collectionDate) + '</span></div>' +
            '<div class="batch-row">' + icon('user') + '<span>Quantity: ' + (b.quantity || 50) + ' ' + (b.unit || 'Kg') + '</span></div>' +
            '<div class="batch-row">' + icon('flask') + '<span>From: ' + b.farmerName + '</span></div>' +
          '</div>' +
          '<a class="btn btn-gradient-orange btn-block mt-4" href="batch-testing-form.html?id=' + encodeURIComponent(b.id) + '">' +
            icon('flask') + '<span>Start Testing</span></a>' +
          '</div>';
      }).join('');
    }
  }
</script>
</body>
</html>
