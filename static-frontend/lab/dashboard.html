<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Lab Portal</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app-shell"></div>
<main class="bg-plain page">
  <div class="page-inner">
    <div class="mb-6">
      <h1 style="font-size:1.9rem;font-weight:700;color:var(--gray-800);margin:0 0 .5rem 0;">Welcome back, Ravi Kumar</h1>
      <p style="color:var(--gray-600);margin:0;">Monitor and manage your herb batches throughout the supply chain</p>
    </div>

    <div class="grid grid-3 mb-6">
      <div class="summary-tile">
        <div><p class="label">Total Batches</p><p class="value" id="statTotal">0</p></div>
        <div class="icon-badge bg-indigo" id="totalIconWrap"></div>
      </div>
      <div class="summary-tile">
        <div><p class="label">Success Rate</p><p class="value" id="statSuccess">0%</p></div>
        <div class="icon-badge bg-orange" id="successIconWrap"></div>
      </div>
      <div class="summary-tile">
        <div><p class="label">Pending Tests</p><p class="value" id="statPending">0</p></div>
        <div class="icon-badge bg-teal" id="pendingIconWrap"></div>
      </div>
    </div>

    <div class="grid grid-4 mb-6" id="tabCards"></div>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  const auth = initLabShell('dashboard');
  if (auth) {
    const total = LAB_BATCHES.length;
    const pending = LAB_BATCHES.filter(function (b) { return b.status === 'PENDING'; });
    const tested = LAB_BATCHES.filter(function (b) { return b.status === 'TESTED'; });
    const rejected = LAB_BATCHES.filter(function (b) { return b.status === 'REJECTED'; });
    const approved = tested.filter(function (b) { return b.approvalStatus !== 'rejected' && !b.manufacturer; });
    const sentToMfg = tested.filter(function (b) { return b.manufacturer; });

    document.getElementById('statTotal').textContent = total;
    document.getElementById('statSuccess').textContent = total > 0 ? Math.round((tested.length / total) * 100) + '%' : '0%';
    document.getElementById('statPending').textContent = pending.length;
    document.getElementById('totalIconWrap').innerHTML = icon('activity');
    document.getElementById('successIconWrap').innerHTML = icon('checkcircle');
    document.getElementById('pendingIconWrap').innerHTML = icon('testtube');

    const tabs = [
      { label: 'Pending Tests', count: pending.length, icon: 'testtube', cls: 'bg-orange', href: 'test-new-batch.html' },
      { label: 'Approved Tests', count: approved.length, icon: 'checkcircle', cls: 'bg-green', href: 'approved-tests.html' },
      { label: 'Sent to Manufacturer', count: sentToMfg.length, icon: 'checkcircle', cls: 'bg-purple', href: 'sent-to-manufacturer.html' },
      { label: 'Rejected Batches', count: rejected.length, icon: 'xcircle', cls: 'bg-red', href: 'rejected-batches.html' }
    ];

    document.getElementById('tabCards').innerHTML = tabs.map(function (t) {
      return '<a class="tab-card ' + t.cls + '" href="' + t.href + '">' +
        '<div class="tab-icon">' + icon(t.icon) + '</div>' +
        '<p class="tab-title">' + t.label + '</p>' +
        '<p class="tab-count">' + t.count + '</p>' +
        '</a>';
    }).join('');
  }
</script>
</body>
</html>
