<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Portal - Sign In</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg-login login-wrap">
  <div class="login-box">
    <div class="text-center mb-6">
      <div class="login-logo"><div class="lg-head"></div><div class="lg-body"></div></div>
      <div class="login-title">
        <h1>LAB PORTAL</h1>
        <p>Sign in to continue</p>
      </div>
    </div>

    <div class="login-card">
      <form id="loginForm">
        <div class="field">
          <label for="labId">Lab ID</label>
          <div class="input-icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>
            <input type="text" id="labId" placeholder="Enter Lab ID" value="LAB001" required>
          </div>
        </div>

        <div class="field">
          <label for="labPassword">Password</label>
          <div class="input-icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="labPassword" placeholder="Enter Password" value="pass456" required>
          </div>
        </div>

        <div id="loginError" class="login-error hidden"></div>

        <button type="submit" id="loginBtn" class="btn btn-gradient-blue btn-block">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
          <span>Login</span>
        </button>
      </form>
    </div>

    <p class="login-footer">© 2026 Lab Portal. All rights reserved.</p>
  </div>
</div>

<script>
  // If already logged in, skip straight to dashboard
  (function () {
    try {
      if (localStorage.getItem('labAuth')) {
        window.location.href = 'dashboard.html';
      }
    } catch (e) {}
  })();

  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const labId = document.getElementById('labId').value.trim();
    const password = document.getElementById('labPassword').value;
    const errorBox = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');

    // Demo auth check against the project's known demo credentials.
    // (LAB001 / pass456 - see project README demo accounts table.)
    if (labId === 'LAB001' && password === 'pass456') {
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner spinner-sm" style="border-color:#fff;border-top-color:transparent;"></div><span>Logging in...</span>';
      setTimeout(function () {
        localStorage.setItem('labAuth', JSON.stringify({ labId: labId }));
        window.location.href = 'dashboard.html';
      }, 400);
    } else {
      errorBox.textContent = 'Invalid Lab ID or Password';
      errorBox.classList.remove('hidden');
    }
  });
</script>
</body>
</html>
