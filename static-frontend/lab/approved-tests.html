<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Approved Tests - Lab Portal</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app-shell"></div>
<main class="bg-green-gray page">
  <div class="page-inner">
    <div class="page-title-row">
      <div class="page-icon-square" style="background:var(--green-600);" id="titleIcon"></div>
      <div><h1>Approved Tests</h1><p class="page-header-sub" style="margin:0;">Batches that passed quality testing</p></div>
    </div>

    <div class="grid grid-4 mb-6" style="margin-top:1rem;">
      <div class="stat-tile"><div class="stat-head" id="s1"></div><p class="stat-value" id="statTotal">0</p></div>
      <div class="stat-tile"><div class="stat-head" id="s2"></div><p class="stat-value" style="color:var(--green-600);" id="statA">0</p></div>
      <div class="stat-tile"><div class="stat-head" id="s3"></div><p class="stat-value" style="color:var(--lab-blue-600);" id="statB">0</p></div>
      <div class="stat-tile"><div class="stat-head" id="s4"></div><p class="stat-value" style="color:var(--orange-600);" id="statC">0</p></div>
    </div>

    <div id="grid" class="grid grid-3"></div>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  const auth = initLabShell('batches');
  if (auth) {
    document.getElementById('titleIcon').innerHTML = icon('checkcircle');
    document.getElementById('s1').innerHTML = icon('award') + '<span>Total Approved</span>';
    document.getElementById('s2').innerHTML = icon('trending') + '<span>Grade A (Excellent)</span>';
    document.getElementById('s3').innerHTML = icon('trending') + '<span>Grade B (Good)</span>';
    document.getElementById('s4').innerHTML = icon('trending') + '<span>Grade C (Acceptable)</span>';

    // Approved = TESTED, not rejected, not yet sent to manufacturer
    const approved = LAB_BATCHES.filter(function (b) {
      return b.status === 'TESTED' && b.approvalStatus !== 'rejected' && !b.manufacturer;
    });

    document.getElementById('statTotal').textContent = approved.length;
    document.getElementById('statA').textContent = approved.filter(function (b) { return b.grade === 'A'; }).length;
    document.getElementById('statB').textContent = approved.filter(function (b) { return b.grade === 'B'; }).length;
    document.getElementById('statC').textContent = approved.filter(function (b) { return b.grade === 'C'; }).length;

    if (approved.length === 0) {
      document.getElementById('grid').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:2rem;color:var(--gray-500);">' +
        icon('checkcircle', 'icon-lg') + '<p>No approved batches waiting for manufacturing</p></div>';
    } else {
      document.getElementById('grid').innerHTML = approved.map(function (b) {
        return '<div class="batch-item border-green">' +
          '<div class="batch-item-head">' +
            '<div><h3>' + b.id + '</h3><p class="batch-product">' + b.productName + '</p></div>' +
            '<span class="badge badge-green">Approved</span>' +
          '</div>' +
          '<div class="grade-box ' + labGradeClass(b.grade) + '"><p>Quality Grade</p><p>' + b.grade + '</p></div>' +
          '<div class="batch-row">' + icon('calendar') + '<span>Approved: ' + labFormatDate(b.testedDate) + '</span></div>' +
          '<div class="batch-row">' + icon('package') + '<span>Quantity: ' + (b.quantity || 'N/A') + ' ' + (b.unit || '') + '</span></div>' +
          '<div class="batch-row"><span class="font-medium">Farmer: ' + b.farmerName + '</span></div>' +
          '<div class="mt-2" style="border-top:1px solid var(--gray-100);padding-top:.75rem;"><p style="margin:0;font-size:.75rem;color:var(--lab-blue-600);font-weight:600;">Ready for Manufacturing</p></div>' +
          '</div>';
      }).join('');
    }
  }
</script>
</body>
</html>
