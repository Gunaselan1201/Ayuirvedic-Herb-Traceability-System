<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support Tickets - Lab Portal</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app-shell"></div>
<main class="bg-plain page">
  <div class="page-inner">
    <div class="flex justify-between items-center mb-6" style="flex-wrap:wrap;gap:1rem;">
      <div class="flex items-center gap-3">
        <div style="width:56px;height:56px;border-radius:.75rem;background:linear-gradient(to bottom right, var(--lab-blue-500), var(--lab-cyan-600));display:flex;align-items:center;justify-content:center;color:#fff;" id="headerIcon"></div>
        <div><h1 style="margin:0;font-size:1.9rem;font-weight:700;">Support Tickets</h1><p style="margin:0;color:var(--gray-600);">View and track your reported issues</p></div>
      </div>
      <a href="report-issue.html" class="btn btn-gradient-blue" id="newIssueBtn"></a>
    </div>

    <div class="filters-bar">
      <div class="filters-grid">
        <div class="search-wrap"><span id="searchIcon"></span><input type="text" id="ticketSearch" placeholder="Search tickets..."></div>
        <select id="statusFilter">
          <option value="All">All Statuses</option>
          <option value="Pending">Pending</option>
          <option value="In Progress">In Progress</option>
          <option value="Resolved">Resolved</option>
          <option value="Closed">Closed</option>
        </select>
        <select id="severityFilter">
          <option value="All">All Severities</option>
          <option value="Low">Low</option>
          <option value="Medium">Medium</option>
          <option value="High">High</option>
        </select>
      </div>
      <div class="mt-4" style="font-size:.85rem;color:var(--gray-600);" id="resultsCount"></div>
    </div>

    <div id="ticketList"></div>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  const auth = initLabShell('help-support');
  if (auth) {
    document.getElementById('headerIcon').innerHTML = icon('clipboard');
    document.getElementById('newIssueBtn').innerHTML = icon('filewarn') + '<span>Report New Issue</span>';
    document.getElementById('searchIcon').innerHTML = icon('search');

    const STATUS_CLASS = { Pending: 'badge-yellow', 'In Progress': 'badge-blue', Resolved: 'badge-green', Closed: 'badge-gray' };
    const SEVERITY_CLASS = { Low: 'badge-green', Medium: 'badge-orange', High: 'badge-red' };
    const SEVERITY_ICON = { Low: 'checkcircle', Medium: 'clock', High: 'alertcircle' };

    let expandedId = null;

    function formatDate(iso) {
      return new Date(iso).toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function render() {
      const search = document.getElementById('ticketSearch').value.toLowerCase();
      const statusFilter = document.getElementById('statusFilter').value;
      const severityFilter = document.getElementById('severityFilter').value;

      let filtered = LAB_TICKETS.filter(function (t) { return t.labId === auth.labId; });
      if (search) {
        filtered = filtered.filter(function (t) {
          return t.ticketId.toLowerCase().includes(search) || t.issueType.toLowerCase().includes(search) || t.description.toLowerCase().includes(search);
        });
      }
      if (statusFilter !== 'All') filtered = filtered.filter(function (t) { return t.status === statusFilter; });
      if (severityFilter !== 'All') filtered = filtered.filter(function (t) { return t.severity === severityFilter; });

      document.getElementById('resultsCount').textContent = 'Showing ' + filtered.length + ' of ' + LAB_TICKETS.filter(function (t) { return t.labId === auth.labId; }).length + ' tickets';

      const list = document.getElementById('ticketList');
      if (filtered.length === 0) {
        list.innerHTML = '<div class="empty-state" style="border:2px dashed var(--gray-300);">' + icon('filewarn', 'icon-lg') +
          '<h3 style="margin:0 0 .5rem 0;">No tickets found</h3><p>Try adjusting your filters, or report your first issue.</p>' +
          '<a href="report-issue.html" class="btn btn-solid-blue mt-4" style="display:inline-flex;">' + icon('filewarn') + '<span>Report First Issue</span></a></div>';
        return;
      }

      list.innerHTML = filtered.map(function (t) {
        const isOpen = expandedId === t.ticketId;
        return '<div class="ticket-card' + (isOpen ? ' expanded' : '') + '" onclick="toggleTicket(\'' + t.ticketId + '\')">' +
          '<div class="ticket-top">' +
            '<div class="flex items-start gap-4" style="flex:1;">' +
              '<div class="ticket-severity-icon ' + SEVERITY_CLASS[t.severity] + '">' + icon(SEVERITY_ICON[t.severity]) + '</div>' +
              '<div style="flex:1;">' +
                '<div class="flex items-center gap-3 mb-2" style="flex-wrap:wrap;">' +
                  '<span class="ticket-id">' + t.ticketId + '</span>' +
                  '<span class="badge ' + SEVERITY_CLASS[t.severity] + '">' + t.severity + '</span>' +
                  '<span class="badge ' + STATUS_CLASS[t.status] + '">' + t.status + '</span>' +
                '</div>' +
                '<h3 class="ticket-title">' + t.issueType + '</h3>' +
                '<p class="ticket-desc">' + t.description.split('\n')[0] + '</p>' +
              '</div>' +
            '</div>' +
            '<div class="ticket-date">' + icon('calendar') + formatDate(t.createdAt) + '</div>' +
          '</div>' +
          '<div class="ticket-detail">' +
            '<div class="grid grid-2 mb-4">' +
              '<div><h4 style="font-size:.85rem;font-weight:600;color:var(--gray-700);margin:0 0 .5rem 0;">Ticket Information</h4>' +
                '<div class="text-sm" style="display:flex;flex-direction:column;gap:.4rem;">' +
                  '<div class="flex items-center gap-2">' + icon('user') + '<span style="color:var(--gray-600);">Reported by:</span><span class="font-medium">' + t.userName + '</span></div>' +
                  '<div class="flex items-center gap-2">' + icon('building') + '<span style="color:var(--gray-600);">Lab ID:</span><span class="font-medium">' + t.labId + '</span></div>' +
                  '<div class="flex items-center gap-2">' + icon('clock') + '<span style="color:var(--gray-600);">Submitted:</span><span class="font-medium">' + formatDate(t.timestamp) + '</span></div>' +
                '</div></div>' +
              '<div><h4 style="font-size:.85rem;font-weight:600;color:var(--gray-700);margin:0 0 .5rem 0;">Full Description</h4>' +
                '<p style="font-size:.85rem;color:var(--gray-600);white-space:pre-line;">' + t.description + '</p></div>' +
            '</div>' +
            (t.adminNotes ? '<div style="background:var(--lab-blue-50);border:1px solid var(--lab-blue-100);border-radius:.5rem;padding:1rem;"><h4 style="font-size:.85rem;font-weight:600;color:#1e3a8a;margin:0 0 .5rem 0;">Admin Notes</h4><p style="font-size:.85rem;color:#1e40af;margin:0;">' + t.adminNotes + '</p></div>' : '') +
          '</div>' +
        '</div>';
      }).join('');
    }

    function toggleTicket(id) {
      expandedId = expandedId === id ? null : id;
      render();
    }
    window.toggleTicket = toggleTicket;

    document.getElementById('ticketSearch').addEventListener('input', render);
    document.getElementById('statusFilter').addEventListener('change', render);
    document.getElementById('severityFilter').addEventListener('change', render);

    render();
  }
</script>
</body>
</html>
