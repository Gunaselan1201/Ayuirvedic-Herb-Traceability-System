<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rejected Batches - Lab Portal</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app-shell"></div>
<main class="bg-red-gray page">
  <div class="page-inner">
    <button class="back-link" id="backBtn"></button>
    <div class="page-title-row">
      <div class="page-icon-square" style="background:var(--red-600);" id="titleIcon"></div>
      <div><h1>Rejected Batches</h1><p class="page-header-sub" style="margin:0;">Batches that failed quality testing standards</p></div>
    </div>

    <div class="grid grid-4 mb-6" style="margin-top:1rem;">
      <div class="stat-tile"><div class="stat-head" id="s1"></div><p class="stat-value" id="statTotal">0</p></div>
      <div class="stat-tile"><div class="stat-head" id="s2"></div><p class="stat-value" style="color:var(--red-600);">1</p></div>
      <div class="stat-tile"><div class="stat-head" id="s3"></div><p class="stat-value" style="color:var(--orange-600);">1</p></div>
      <div class="stat-tile"><div class="stat-head" id="s4"></div><p class="stat-value" style="color:var(--green-600);">86%</p></div>
    </div>

    <div id="grid" class="grid grid-2"></div>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  const auth = initLabShell('rejected');
  if (auth) {
    document.getElementById('backBtn').innerHTML = icon('arrowleft') + '<span>Back</span>';
    document.getElementById('backBtn').addEventListener('click', function () { window.history.back(); });
    document.getElementById('titleIcon').innerHTML = icon('xcircle');
    document.getElementById('s1').innerHTML = icon('xcircle') + '<span>Total Rejected</span>';
    document.getElementById('s2').innerHTML = icon('alerttriangle') + '<span>Pesticide</span>';
    document.getElementById('s3').innerHTML = icon('alerttriangle') + '<span>Moisture</span>';
    document.getElementById('s4').innerHTML = icon('package') + '<span>Pass Rate</span>';

    const rejected = LAB_BATCHES.filter(function (b) { return b.status === 'REJECTED'; });
    document.getElementById('statTotal').textContent = rejected.length;

    if (rejected.length === 0) {
      document.getElementById('grid').innerHTML =
        '<div class="empty-state" style="grid-column:1/-1;">' +
          '<div class="empty-circle">' + icon('xcircle') + '</div>' +
          '<h2>No Rejected Batches</h2>' +
          '<p>All tested batches have passed quality standards!</p>' +
          '<p style="font-size:.85rem;color:var(--gray-500);">Rejected batches will appear here with detailed failure reasons</p>' +
        '</div>';
    } else {
      document.getElementById('grid').innerHTML = rejected.map(function (b) {
        return '<div class="batch-item border-red">' +
          '<div class="batch-item-head">' +
            '<div><h3>' + b.id + '</h3><p class="batch-product">' + b.productName + '</p></div>' +
            '<span class="badge badge-red">Rejected</span>' +
          '</div>' +
          '<div class="batch-row">' + icon('calendar') + '<span>Rejected: ' + labFormatDate(b.testedDate || b.collectionDate) + '</span></div>' +
          '<div class="batch-row">' + icon('user') + '<span>Rejected By: ' + (b.rejectedBy || 'Lab QC') + '</span></div>' +
          '<div style="background:var(--red-50);border:1px solid var(--red-100);border-radius:.5rem;padding:1rem;margin:.75rem 0;">' +
            '<div class="flex" style="gap:.5rem;align-items:flex-start;">' + icon('alerttriangle') +
              '<div><p style="font-size:.7rem;font-weight:700;color:#991b1b;margin:0 0 .25rem 0;">Rejection Reason:</p>' +
              '<p style="font-size:.85rem;color:var(--gray-700);margin:0;">' + (b.reason || 'Quality standards not met') + '</p></div>' +
            '</div>' +
          '</div>' +
          '<button class="btn btn-gray btn-block" onclick="alert(\'Detailed batch view is a demo-only action.\')">View Details &rarr;</button>' +
          '</div>';
      }).join('');
    }
  }
</script>
</body>
</html>
