<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test History - Lab Portal</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app-shell"></div>
<main class="bg-blue-gray page">
  <div class="page-inner">
    <button class="back-link" id="backBtn"></button>

    <div class="flex justify-between items-start mb-6" style="flex-wrap:wrap;gap:1rem;">
      <div class="page-title-row" style="margin-bottom:0;">
        <div class="page-icon-square" style="background:var(--lab-blue-600);" id="titleIcon"></div>
        <div><h1>Test History</h1><p class="page-header-sub" style="margin:0;">All laboratory test records</p></div>
      </div>
      <button class="btn btn-solid-blue" id="exportBtn"></button>
    </div>

    <div class="mb-6">
      <div class="search-wrap">
        <span id="searchIcon"></span>
        <input type="text" id="searchInput" placeholder="Search by product or batch ID">
      </div>
    </div>

    <div id="testList"></div>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  const auth = initLabShell('last-tested');
  if (auth) {
    document.getElementById('backBtn').innerHTML = icon('arrowleft') + '<span>Back</span>';
    document.getElementById('backBtn').addEventListener('click', function () { window.history.back(); });
    document.getElementById('titleIcon').innerHTML = icon('archive');
    document.getElementById('exportBtn').innerHTML = icon('download') + '<span>Export All</span>';
    document.getElementById('exportBtn').addEventListener('click', function () { alert('Export is a demo-only action in this static build.'); });
    document.getElementById('searchIcon').innerHTML = icon('search');

    const allTests = LAB_BATCHES
      .filter(function (b) { return b.status === 'TESTED' || b.status === 'REJECTED'; })
      .slice()
      .sort(function (a, b) { return new Date(b.testedDate) - new Date(a.testedDate); });
    if (allTests.length > 0) allTests[0]._isLast = true;

    function renderList(filterText) {
      const term = (filterText || '').toLowerCase();
      const filtered = allTests.filter(function (t) {
        return t.productName.toLowerCase().includes(term) || t.id.toLowerCase().includes(term);
      });
      const container = document.getElementById('testList');
      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-state">' + icon('archive', 'icon-lg') + '<p style="font-size:1.1rem;">No test history available</p></div>';
        return;
      }
      container.innerHTML = filtered.map(function (t) {
        const isLast = !!t._isLast;
        const gradeCls = labGradeClass(t.grade);
        const dt = new Date(t.testedDate);
        const row =
          '<div class="' + (isLast ? 'card-lg' : 'card') + ' mb-3" style="' +
            (isLast ? 'background:linear-gradient(to right, #eff6ff, #eef2ff);border:2px solid #93c5fd;' : 'border:1px solid var(--gray-200);') + '">' +
            '<div class="flex justify-between items-center mb-3" style="flex-wrap:wrap;gap:.75rem;">' +
              '<div class="flex items-center gap-3">' +
                (isLast ? '<span class="badge" style="background:var(--lab-blue-500);color:#fff;text-transform:uppercase;">Last Tested</span>' : '') +
                '<div style="background:' + (isLast ? 'var(--lab-blue-100)' : 'var(--gray-100)') + ';padding:.5rem;border-radius:.5rem;">' + icon('flask') + '</div>' +
              '</div>' +
              '<button class="btn btn-solid-green btn-sm" onclick="alert(\'PDF report download is a demo-only action.\')">' + icon('download') + '<span>Download Report</span></button>' +
            '</div>' +
            '<div class="grid grid-4">' +
              '<div><p class="text-xs text-gray-600 mb-1">Product Name</p><p class="font-bold text-gray-800">' + t.productName + '</p></div>' +
              '<div><p class="text-xs text-gray-600 mb-1">Batch ID</p><p class="font-bold" style="color:var(--lab-blue-700);">' + t.id + '</p></div>' +
              '<div><p class="text-xs text-gray-600 mb-1">Quality Grade</p><span class="badge ' + gradeCls + '">' + (t.grade || 'N/A') + '</span></div>' +
              '<div><p class="text-xs text-gray-600 mb-1">Date &amp; Time</p><p class="font-semibold text-gray-800">' + dt.toLocaleDateString('en-GB') + '</p><p class="text-xs text-gray-600">' + dt.toLocaleTimeString('en-GB') + '</p></div>' +
            '</div>' +
          '</div>';
        return row;
      }).join('');
    }

    renderList('');
    document.getElementById('searchInput').addEventListener('input', function (e) { renderList(e.target.value); });
  }
</script>
</body>
</html>
