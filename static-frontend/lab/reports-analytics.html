<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports &amp; Analytics - Lab Portal</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app-shell"></div>
<main class="bg-indigo-purple page">
  <div class="page-inner">
    <div class="card-lg mb-6" style="border:1px solid var(--indigo-100);">
      <div class="flex justify-between items-center" style="flex-wrap:wrap;gap:1rem;">
        <div class="flex items-center gap-4">
          <div style="width:56px;height:56px;border-radius:.75rem;background:linear-gradient(to bottom right, var(--indigo-500), var(--purple-600));display:flex;align-items:center;justify-content:center;color:#fff;" id="headerIcon"></div>
          <div><h1 style="margin:0;font-size:1.5rem;font-weight:700;">Reports &amp; Analytics</h1><p style="margin:0;color:var(--gray-600);font-size:.9rem;">Visual insights into lab operations</p></div>
        </div>
        <button class="btn btn-solid-indigo" id="exportBtn"></button>
      </div>
    </div>

    <div class="grid grid-4 mb-6">
      <div class="metric-card">
        <div class="metric-top">
          <div class="metric-icon" style="background:var(--green-100);color:var(--green-600);" id="mi1"></div>
          <span class="metric-tag" style="background:var(--green-100);color:var(--green-700);">+12%</span>
        </div>
        <p class="metric-label">Total Tests</p><p class="metric-value" id="mvTotal">0</p>
      </div>
      <div class="metric-card">
        <div class="metric-top">
          <div class="metric-icon" style="background:var(--orange-100);color:var(--orange-600);" id="mi2"></div>
          <span class="metric-tag" style="background:var(--orange-100);color:var(--orange-600);">Active</span>
        </div>
        <p class="metric-label">Pending</p><p class="metric-value" id="mvPending">0</p>
      </div>
      <div class="metric-card">
        <div class="metric-top">
          <div class="metric-icon" style="background:var(--lab-blue-100);color:var(--lab-blue-600);" id="mi3"></div>
          <span class="metric-tag" style="background:var(--lab-blue-100);color:var(--lab-blue-700);">Excellent</span>
        </div>
        <p class="metric-label">Pass Rate</p><p class="metric-value" id="mvPass">0%</p>
      </div>
      <div class="metric-card">
        <div class="metric-top">
          <div class="metric-icon" style="background:var(--purple-100);color:var(--purple-600);" id="mi4"></div>
          <span class="metric-tag" style="background:var(--purple-100);color:var(--purple-700);">Avg</span>
        </div>
        <p class="metric-label">Test Duration</p><p class="metric-value" style="font-size:1.4rem;">15 minutes</p>
      </div>
    </div>

    <div class="grid grid-2 mb-6">
      <div class="chart-card">
        <h3 id="chartTitle1"></h3>
        <div class="bar-chart" id="barChart"></div>
      </div>
      <div class="chart-card">
        <h3 id="chartTitle2"></h3>
        <div class="donut-wrap" id="donutWrap"></div>
      </div>
    </div>

    <div class="chart-card">
      <h3 style="margin-bottom:1rem;">Recent Test Activity</h3>
      <div id="activityList"></div>
    </div>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  const auth = initLabShell('reports');
  if (auth) {
    document.getElementById('headerIcon').innerHTML = icon('piechart');
    document.getElementById('exportBtn').innerHTML = icon('download') + '<span>Export Report</span>';
    document.getElementById('exportBtn').addEventListener('click', function () { alert('PDF export is a demo-only action in this static build.'); });
    document.getElementById('mi1').innerHTML = icon('trending');
    document.getElementById('mi2').innerHTML = icon('calendar');
    document.getElementById('mi3').innerHTML = icon('barchart');
    document.getElementById('mi4').innerHTML = icon('piechart');
    document.getElementById('chartTitle1').innerHTML = icon('barchart') + 'Monthly Testing Trends';
    document.getElementById('chartTitle2').innerHTML = icon('piechart') + 'Pass/Fail Distribution';

    const tested = LAB_BATCHES.filter(function (b) { return b.status === 'TESTED'; });
    const rejected = LAB_BATCHES.filter(function (b) { return b.status === 'REJECTED'; });
    const pending = LAB_BATCHES.filter(function (b) { return b.status === 'PENDING'; });
    const totalDone = tested.length + rejected.length;
    const passRate = totalDone > 0 ? Math.round((tested.length / totalDone) * 100) : 100;

    document.getElementById('mvTotal').textContent = tested.length;
    document.getElementById('mvPending').textContent = pending.length;
    document.getElementById('mvPass').textContent = passRate + '%';

    // Simple CSS bar chart - mock monthly trend
    const months = [
      { label: 'Apr', value: 4 }, { label: 'May', value: 6 }, { label: 'Jun', value: 5 },
      { label: 'Jul', value: 8 }, { label: 'Aug', value: 9 }, { label: 'Sep', value: totalDone || 3 }
    ];
    const maxVal = Math.max.apply(null, months.map(function (m) { return m.value; }));
    document.getElementById('barChart').innerHTML = months.map(function (m) {
      const h = maxVal > 0 ? Math.max(6, Math.round((m.value / maxVal) * 100)) : 6;
      return '<div class="bar-col"><div class="bar" style="height:' + h + '%;" title="' + m.value + '"></div><span class="bar-label">' + m.label + '</span></div>';
    }).join('');

    // Simple CSS conic-gradient donut for pass/fail distribution
    const passPct = passRate;
    const failPct = 100 - passRate;
    document.getElementById('donutWrap').innerHTML =
      '<div class="donut" style="background:conic-gradient(#22c55e 0 ' + passPct + '%, #ef4444 ' + passPct + '% 100%);"></div>' +
      '<div class="donut-legend">' +
        '<div class="legend-row"><span class="legend-dot" style="background:#22c55e;"></span>Passed (' + passPct + '%)</div>' +
        '<div class="legend-row"><span class="legend-dot" style="background:#ef4444;"></span>Rejected (' + failPct + '%)</div>' +
      '</div>';

    const activity = tested.slice(0, 5);
    if (activity.length === 0) {
      document.getElementById('activityList').innerHTML = '<div style="text-align:center;padding:2rem;color:var(--gray-500);">No test results yet</div>';
    } else {
      document.getElementById('activityList').innerHTML = activity.map(function (b) {
        return '<div class="activity-row">' +
          '<div class="activity-left"><div class="activity-icon">' + icon('trending') + '</div>' +
          '<div><p class="activity-name">' + b.id + '</p><p class="activity-sub">' + b.productName + '</p></div></div>' +
          '<div style="text-align:right;"><span class="badge badge-green">Passed</span><p style="font-size:.75rem;color:var(--gray-500);margin:.25rem 0 0 0;">Tested by: ' + (b.addedBy || 'Lab Team') + '</p></div>' +
          '</div>';
      }).join('');
    }
  }
</script>
</body>
</html>
