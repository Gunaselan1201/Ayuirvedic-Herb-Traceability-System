<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Active Batches</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-amber-page min-h-screen">
  <div id="app-shell"></div>

  <main class="page-wrap">
    <div style="margin-bottom:24px;">
      <a class="btn-back" href="dashboard.html" id="backLink"></a>
      <div class="page-header-row">
        <div class="page-header-icon icon-lg grad-amber" id="headerIconBox"></div>
        <div>
          <h1 class="page-title">Active Batches</h1>
          <p class="page-sub">Currently in production</p>
        </div>
      </div>
    </div>

    <div class="grid grid-2" id="statCards" style="margin-bottom:24px;"></div>

    <div id="ordersArea"></div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      var session = MFR_APP.init();
      if (!session) return;

      document.getElementById('backLink').innerHTML = MFR_APP.svg('arrowLeft') + '<span>Back to Dashboard</span>';
      document.getElementById('headerIconBox').innerHTML = MFR_APP.svg('clock');

      var result = MFR_DATA.getActiveBatches();
      var stats = result.stats;
      var batches = result.list;

      document.getElementById('statCards').innerHTML =
        '<div class="stat-card simple border-amber"><div><p class="stat-label">Active Batches</p><p class="stat-value" style="color:var(--amber-600);">' + stats.total + '</p></div>' + MFR_APP.svg('activity') + '</div>' +
        '<div class="stat-card simple" style="border-color:var(--orange-500);"><div><p class="stat-label">Avg Days in Production</p><p class="stat-value" style="color:var(--orange-600);">' + stats.avgDays + '</p></div>' + MFR_APP.svg('trending') + '</div>';

      var area = document.getElementById('ordersArea');

      if (batches.length === 0) {
        area.innerHTML = '<div class="state-box">' + MFR_APP.svg('clock') + '<h2>No Active Batches</h2><p>Batches in production will appear here</p></div>';
        return;
      }

      area.innerHTML = '<div class="grid grid-3">' + batches.map(function (b) {
        return (
          '<div class="order-card border-amber">' +
            '<div class="order-card-top">' +
              '<div><h3>' + MFR_APP.escapeHtml(b.id) + '</h3><p>' + MFR_APP.escapeHtml(b.productName) + '</p></div>' +
              '<span class="grade-badge pill-amber" style="background:var(--amber-100);color:var(--amber-700);">Grade ' + MFR_APP.escapeHtml(b.grade) + '</span>' +
            '</div>' +
            '<div class="order-meta">' +
              '<div class="order-meta-row">' + MFR_APP.svg('package') + '<span>' + MFR_APP.escapeHtml(b.quantity) + '</span></div>' +
              '<div class="order-meta-row">' + MFR_APP.svg('user') + '<span>' + MFR_APP.escapeHtml(b.farmerName) + '</span></div>' +
              '<div class="order-meta-row">' + MFR_APP.svg('calendar') + '<span>Started: ' + b.startDate + '</span></div>' +
              '<div class="order-meta-row">' + MFR_APP.svg('clock') + '<span>' + b.daysInProduction + ' days in production</span></div>' +
            '</div>' +
            '<div class="order-card-footer"><span class="status-pill pill-amber">' + MFR_APP.escapeHtml(b.status) + '</span>' + MFR_APP.svg('activity', 'pulse') + '</div>' +
          '</div>'
        );
      }).join('') + '</div>';
    })();
  </script>
</body>
</html>
