<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products Manufactured</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-green-page min-h-screen">
  <div id="app-shell"></div>

  <main class="page-wrap">
    <div style="margin-bottom:24px;">
      <a class="btn-back" href="dashboard.html" id="backLink"></a>
      <div class="page-header-row">
        <div class="page-header-icon icon-lg grad-green" id="headerIconBox"></div>
        <div>
          <h1 class="page-title">Products Manufactured</h1>
          <p class="page-sub">Completed products ready to ship</p>
        </div>
      </div>
    </div>

    <div class="grid grid-4" id="statCards" style="margin-bottom:24px;"></div>

    <div id="ordersArea"></div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      var session = MFR_APP.init();
      if (!session) return;

      document.getElementById('backLink').innerHTML = MFR_APP.svg('arrowLeft') + '<span>Back to Dashboard</span>';
      document.getElementById('headerIconBox').innerHTML = MFR_APP.svg('package');

      var result = MFR_DATA.getManufactured();
      var stats = result.stats;
      var batches = result.list;

      document.getElementById('statCards').innerHTML =
        '<div class="stat-card simple border-green"><div><p class="stat-label">Total Manufactured</p><p class="stat-value" style="color:var(--green-600);">' + stats.total + '</p></div>' + MFR_APP.svg('checkCircle') + '</div>' +
        '<div class="stat-card simple" style="border-color:var(--emerald-500);"><div><p class="stat-label">Grade A</p><p class="stat-value" style="color:var(--emerald-600);">' + stats.gradeA + '</p></div>' + MFR_APP.svg('award') + '</div>' +
        '<div class="stat-card simple border-blue"><div><p class="stat-label">Grade B</p><p class="stat-value" style="color:var(--blue-600);">' + stats.gradeB + '</p></div>' + MFR_APP.svg('award') + '</div>' +
        '<div class="stat-card simple border-amber"><div><p class="stat-label">Grade C</p><p class="stat-value" style="color:var(--amber-600);">' + stats.gradeC + '</p></div>' + MFR_APP.svg('award') + '</div>';

      var area = document.getElementById('ordersArea');

      if (batches.length === 0) {
        area.innerHTML = '<div class="state-box">' + MFR_APP.svg('package') + '<h2>No Manufactured Products</h2><p>Completed products will appear here</p></div>';
        return;
      }

      area.innerHTML = '<div class="grid grid-3">' + batches.map(function (b) {
        return (
          '<div class="order-card border-green">' +
            '<div class="order-card-top">' +
              '<div><h3>' + MFR_APP.escapeHtml(b.id) + '</h3><p>' + MFR_APP.escapeHtml(b.productName) + '</p></div>' +
              '<span class="grade-badge" style="background:var(--green-100);color:var(--green-700);">Grade ' + MFR_APP.escapeHtml(b.grade) + '</span>' +
            '</div>' +
            '<div class="order-meta">' +
              '<div class="order-meta-row">' + MFR_APP.svg('box') + '<span>' + MFR_APP.escapeHtml(b.quantity) + '</span></div>' +
              '<div class="order-meta-row">' + MFR_APP.svg('user') + '<span>' + MFR_APP.escapeHtml(b.farmerName) + '</span></div>' +
              '<div class="order-meta-row">' + MFR_APP.svg('calendar') + '<span>Completed: ' + b.completionDate + '</span></div>' +
              '<div class="order-meta-row">' + MFR_APP.svg('package') + '<span>' + b.daysToManufacture + ' days to manufacture</span></div>' +
            '</div>' +
            '<div class="order-card-footer"><span class="status-pill pill-green">' + MFR_APP.escapeHtml(b.status) + '</span>' + MFR_APP.svg('checkCircle') + '</div>' +
          '</div>'
        );
      }).join('') + '</div>';
    })();
  </script>
</body>
</html>
